name: Boxie observability faults

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/boxie-observability.yml'
      - 'tools/boxie/infra/observability/**'
      - 'tools/boxie/infra/ingress/**'
      - 'tools/boxie/infra/postgres/**'
      - 'tools/boxie/infra/temporal/**'
      - 'tools/boxie/**'
      - 'tools/cli-playground/Sandbox.Dockerfile*'
      - 'tools/cli-playground/infra/**'
      - 'coreutils/echor/**'
      - 'utils/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'

permissions:
  contents: read

concurrency:
  group: boxie-observability-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Install signed runsc without touching the shared Docker daemon
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl --fail --silent --show-error --location --max-time 60 https://gvisor.dev/archive.key \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main' \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
      - name: Locked workspace and isolated fixture identity
        timeout-minutes: 3
        run: |
          uv sync --locked --all-packages
          fixture_suffix="$(uv run --locked python -c 'from uuid import uuid4; print(uuid4().hex[:12])')"
          printf 'BOXIE_SMOKE_ROOT=/var/tmp/boxie-observability-%s\n' "$fixture_suffix" >> "$GITHUB_ENV"
          uv run --locked pytest tools/boxie/infra/observability/tests/test_smoke.py tools/boxie/infra/ingress/tests/test_access_smoke.py
          uv run --locked pytest tools/boxie/infra/observability/tests/test_smoke.py -m integration
      - name: Build final images and preflight owned journal, daemon, HTTP and PTY
        id: setup
        timeout-minutes: 21
        run: |
          sudo env "PATH=$PATH" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            timeout --signal=TERM --kill-after=10s 1220s \
            .venv/bin/python -m observability_infra.smoke prepare --root "$BOXIE_SMOKE_ROOT"
      - name: Separately budgeted native fault cases
        id: scenarios
        timeout-minutes: 28
        run: |
          for scenario in lifecycle-failure collector-restart storage-restart producer-pipe journal-stopped journal-retention journal-enospc vector-full vector-enospc; do
            scenario_exit=0
            sudo env "PATH=$PATH" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
              timeout --signal=TERM --kill-after=5s 185s \
              .venv/bin/python -m observability_infra.smoke scenario --root "$BOXIE_SMOKE_ROOT" --scenario "$scenario" || scenario_exit=$?
            sudo env "PATH=$PATH" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
              timeout 10s .venv/bin/python -m observability_infra.smoke record-step \
              --root "$BOXIE_SMOKE_ROOT" --scenario "$scenario" --exit-code "$scenario_exit"
            if [ "$scenario_exit" -ne 0 ]; then
              exit "$scenario_exit"
            fi
          done
      - name: Preserve bounded evidence before outer cleanup
        id: evidence_before_cleanup
        if: ${{ always() && env.BOXIE_SMOKE_ROOT != '' }}
        timeout-minutes: 1
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SCENARIO_OUTCOME: ${{ steps.scenarios.outcome }}
        run: |
          sudo .venv/bin/python -m observability_infra.smoke export \
            --root "$BOXIE_SMOKE_ROOT" --evidence-dir "$RUNNER_TEMP/boxie-observability-before-cleanup" \
            --setup-outcome "$SETUP_OUTCOME" --scenario-outcome "$SCENARIO_OUTCOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload_before_cleanup
        if: ${{ always() && env.BOXIE_SMOKE_ROOT != '' }}
        timeout-minutes: 2
        with:
          name: boxie-observability-before-cleanup
          path: ${{ runner.temp }}/boxie-observability-before-cleanup/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Restore exact owned resources before runner disposal
        id: cleanup
        if: ${{ always() && env.BOXIE_SMOKE_ROOT != '' }}
        timeout-minutes: 4
        run: |
          sudo env "PATH=$PATH" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            timeout --signal=TERM --kill-after=5s 190s \
            .venv/bin/python -m observability_infra.smoke cleanup --root "$BOXIE_SMOKE_ROOT"
      - name: Export bounded nonsecret evidence allowlist
        if: ${{ always() && env.BOXIE_SMOKE_ROOT != '' }}
        run: |
          sudo .venv/bin/python -m observability_infra.smoke export \
            --root "$BOXIE_SMOKE_ROOT" --evidence-dir "$RUNNER_TEMP/boxie-observability-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload_after_cleanup
        if: ${{ always() && env.BOXIE_SMOKE_ROOT != '' }}
        with:
          name: boxie-observability-native
          path: ${{ runner.temp }}/boxie-observability-evidence/*.json
          if-no-files-found: error
          retention-days: 7
