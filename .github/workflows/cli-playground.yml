name: 🏗️ Playground PR binary builds

# Keep this condition aligned with the first job: downstream workflows skip without a runner.
run-name: >-
  ${{
    (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) &&
    format('🏗️ Playground CLI builds for PR #{0}', github.event.pull_request.number) || '⏭️ CI skipped'
  }}

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: cli-playground-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build affected CLI preview binaries
    if: >-
      ${{
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out the PR source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - name: 📍 Resolve workspace packages
        id: projects
        run: |
          set -euo pipefail
          boxie=$(uv workspace dir --package boxie)
          playground=$(uv workspace dir --package cli-playground)
          printf 'boxie=%s\nplayground=%s\n' "$boxie" "$playground" >> "$GITHUB_OUTPUT"
      - name: ♻️ Restore compatible Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: rust-release-v1
          cache-workspace-crates: false
          add-rust-environment-hash-key: true
          cache-bin: false
      - name: 🏗️ Build affected Linux CLI executables
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOXIE_DIR: ${{ steps.projects.outputs.boxie }}
          PLAYGROUND_DIR: ${{ steps.projects.outputs.playground }}
        run: |
          uv run --locked --no-dev python "${PLAYGROUND_DIR}/preview_ci.py" build \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/playground-artifact"
      - name: 📤 Upload playground CLI binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-playground-binaries
          path: ${{ runner.temp }}/playground-artifact/
          if-no-files-found: ignore
          retention-days: 7
