name: CLI playground build

# Keep this condition aligned with the first job: downstream workflows skip without a runner.
run-name: >-
  ${{
    (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) &&
    format('CLI playground build for PR #{0}', github.event.pull_request.number) || 'CI skipped'
  }}

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: cli-playground-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Build affected native Linux binaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --locked --no-dev python tools/cli-playground/preview_ci.py build \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output target/playground-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-playground-binaries
          path: target/playground-artifact/
          if-no-files-found: ignore
          retention-days: 7
