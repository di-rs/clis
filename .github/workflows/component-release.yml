name: Component application release

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      directory:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image_variable:
        required: true
        type: string

permissions: {}

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ inputs.component }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable component manifest
        env:
          COMPONENT_DIRECTORY: ${{ inputs.directory }}
          IMAGE_VARIABLE: ${{ inputs.image_variable }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['COMPONENT_DIRECTORY']) / 'release.example.json').read_text())
          release['revision'] = os.environ['REVISION']
          release['images'][os.environ['IMAGE_VARIABLE']] = os.environ['IMAGE']
          Path('release.json').write_text(json.dumps(release, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.component }}-release
          path: release.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: release
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: ${{ inputs.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: component-production-${{ inputs.component }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
      - run: uv sync --locked --all-packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.component }}-release
      - name: Activate only this component
        env:
          COMPONENT_DIRECTORY: ${{ inputs.directory }}
          CONNECTION_PROFILE: ${{ vars.DEPLOYMENT_PROFILE }}
          SSH_IDENTITY: ${{ secrets.DEPLOYMENT_SSH_KEY }}
          COMPONENT_ENVIRONMENT: ${{ secrets.COMPONENT_ENVIRONMENT }}
        run: |
          set -euo pipefail
          private=$(mktemp -d)
          trap 'rm -rf "$private"' EXIT
          export DEPLOY_PRIVATE="$private"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['DEPLOY_PRIVATE'])
          for name, key in [('profile.json','CONNECTION_PROFILE'),('identity','SSH_IDENTITY'),('environment.json','COMPONENT_ENVIRONMENT')]:
              with os.fdopen(os.open(root / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as f:
                  f.write(os.environ[key])
          PY
          uv run --locked python -m deploy_tool prepare --descriptor "$COMPONENT_DIRECTORY/release-component.json" --release release.json --environment "$private/environment.json" --output "$private/prepared"
          uv run --locked python -m deploy_tool deploy --prepared "$private/prepared" --profile "$private/profile.json" --identity "$private/identity" --timeout 900
