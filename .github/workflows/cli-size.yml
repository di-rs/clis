name: 📦 Binary size execution

# Keep this condition aligned with the first job: downstream workflows skip without a runner.
run-name: >-
  ${{
    (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) &&
    format('📦 Binary sizes for PR #{0}', github.event.pull_request.number) || '⏭️ CI skipped'
  }}

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: cli-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sizes:
    name: 📦 Measure Linux binary sizes
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 📥 Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cli-size
      - name: 📏 Build and measure affected binaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --no-dev python tools/cli-bench/collect_sizes.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/cli-size-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/sizes.json"
      - name: 📤 Upload size measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-size-linux
          path: ${{ runner.temp }}/cli-size-${{ github.run_id }}-${{ github.run_attempt }}/sizes.json
          retention-days: 14
          if-no-files-found: warn
