name: 🚀 CLI playground release
'on':
  push:
    branches:
    - master
    paths:
    - tools/cli-playground/src/playground/**
    - tools/cli-playground/pyproject.toml
    - tools/cli-playground/infra/Playground.Dockerfile*
    - tools/cli-playground/infra/compose.production.yml
    - tools/cli-playground/infra/release*.json
    - tools/deploy/**
    - .github/workflows/component-release.yml
    - pyproject.toml
    - uv.lock
    - tools/cli-playground/frontend/**
    - tools/cli-playground/infra/routes.yml
    - .github/workflows/cli-playground-release.yml
  workflow_dispatch: null
permissions: {}
concurrency:
  group: playground-release
  cancel-in-progress: false
jobs:
  application:
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name != 'push' || vars.PLAYGROUND_AUTO_DEPLOY
      == 'true') }}
    permissions:
      contents: read
      packages: write
    # actionlint 1.7.12 lacks $/ support; reusable ./ calls still resolve the caller commit.
    uses: ./.github/workflows/component-release.yml # zizmor: ignore[self-repository]
    with:
      component: playground
      directory: tools/cli-playground/infra
      dockerfile: tools/cli-playground/infra/Playground.Dockerfile
      image_variable: PLAYGROUND_IMAGE
