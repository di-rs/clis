name: CLI playground release

# Runtime releases use reviewed default-branch code; PR binaries have a separate flow.
# PR binary previews use the separate playground build/publish workflows.
on:
  push:
    branches: [master]
    paths:
      - 'tools/cli-playground/playground/**'
      - 'tools/cli-playground/frontend/**'
      - 'tools/cli-playground/fixtures/**'
      - 'tools/cli-playground/Gateway.Dockerfile*'
      - 'tools/cli-playground/Sandbox.Dockerfile*'
      - 'tools/cli-playground/shell.sh'
      - 'tools/cli-playground/compose.production.yml'
      - 'tools/cli-playground/pyproject.toml'
      - 'tools/cli-playground/infra/deploy.py'
      - 'tools/cli-playground/infra/deploy.sh'
      - 'tools/cli-playground/infra/ci.py'
      - 'tools/cli-playground/infra/routes.yml'
      - '.github/workflows/cli-playground-release.yml'
      - '.github/workflows/cli-playground-deploy.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  workflow_dispatch:
  workflow_call:
    secrets:
      PLAYGROUND_DEPLOY_TOKEN:
        required: true
      PULUMI_CONFIG_PASSPHRASE:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
    outputs:
      revision:
        description: Reviewed source revision
        value: ${{ jobs.release.outputs.revision }}
      gateway_image:
        description: Immutable gateway image
        value: ${{ jobs.release.outputs.gateway_image }}
      sandbox_image:
        description: Immutable sandbox image
        value: ${{ jobs.release.outputs.sandbox_image }}

permissions: {}

concurrency:
  group: cli-playground-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name != 'push' || vars.PLAYGROUND_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ github.sha }}
      gateway_image: ${{ steps.images.outputs.gateway }}@${{ steps.gateway.outputs.digest }}
      sandbox_image: ${{ steps.images.outputs.sandbox }}@${{ steps.sandbox.outputs.digest }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Choose image names and unique run tag
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            printf 'gateway=ghcr.io/%s-playground-gateway\n' "${REPOSITORY,,}"
            printf 'sandbox=ghcr.io/%s-playground-sandbox\n' "${REPOSITORY,,}"
            printf 'tag=run-%s-%s\n' "$RUN_ID" "$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the Python gateway and static frontend
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/cli-playground/Gateway.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.gateway }}:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish the shared shell sandbox
        id: sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/cli-playground/Sandbox.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.sandbox }}:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record the immutable runtime release
        env:
          REVISION: ${{ github.sha }}
          GATEWAY_IMAGE: ${{ steps.images.outputs.gateway }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          SANDBOX_IMAGE: ${{ steps.images.outputs.sandbox }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          revision = os.environ["REVISION"]
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("Invalid release revision")
          release = {"revision": revision}
          for image in ("gateway", "sandbox"):
              name = os.environ[f"{image.upper()}_IMAGE"]
              digest = os.environ[f"{image.upper()}_DIGEST"]
              if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit(f"Invalid {image} image digest")
              release[f"{image}_image"] = f"{name}@{digest}"
          payload = json.dumps(release, indent=2) + "\n"
          Path("release.json").write_text(payload, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Playground runtime release\n\n")
              summary.write("```json\n" + payload + "```\n\n")
              summary.write(
                  "The runtime deployment job applies these exact digests to the existing host.\n"
              )
          PY
      - name: Upload the immutable release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-playground-release
          path: release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  deploy:
    needs: release
    permissions:
      contents: read
      packages: read
    # ./ resolves this caller's commit; actionlint 1.7.12 lacks the newer $/ syntax.
    uses: ./.github/workflows/cli-playground-deploy.yml # zizmor: ignore[self-repository]
    with:
      revision: ${{ needs.release.outputs.revision }}
      gateway_image: ${{ needs.release.outputs.gateway_image }}
      sandbox_image: ${{ needs.release.outputs.sandbox_image }}
    secrets:
      PLAYGROUND_DEPLOY_TOKEN: ${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
