name: 🚀 Playground runtime release

# Runtime releases use reviewed default-branch code; PR binaries have a separate flow.
# PR binary previews use the separate playground build/publish workflows.
on:
  push:
    branches: [master]
    paths:
      - 'tools/cli-playground/src/playground/**'
      - 'tools/cli-playground/frontend/**'
      - 'tools/cli-playground/fixtures/**'
      - 'tools/cli-playground/infra/Playground.Dockerfile*'
      - 'tools/cli-playground/Sandbox.Dockerfile*'
      - 'tools/cli-playground/shell.sh'
      - 'tools/cli-playground/infra/compose.production.yml'
      - 'tools/cli-playground/pyproject.toml'
      - 'tools/cli-playground/infra/playground_infra/deploy.py'
      - 'tools/cli-playground/infra/deploy.sh'
      - 'tools/cli-playground/infra/playground_infra/ci.py'
      - 'tools/cli-playground/infra/routes.yml'
      - '.github/workflows/cli-playground-release.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_DNS_API_TOKEN:
        required: true
      PLAYGROUND_DEPLOY_TOKEN:
        required: true
      PULUMI_CONFIG_PASSPHRASE:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
    outputs:
      revision:
        description: Reviewed source revision
        value: ${{ jobs.release.outputs.revision }}
      gateway_image:
        description: Immutable gateway image
        value: ${{ jobs.release.outputs.gateway_image }}
      sandbox_image:
        description: Immutable sandbox image
        value: ${{ jobs.release.outputs.sandbox_image }}

permissions: {}

concurrency:
  group: cli-playground-release
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Build and publish playground runtime images
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name != 'push' || vars.PLAYGROUND_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ github.sha }}
      gateway_image: ${{ steps.images.outputs.gateway }}@${{ steps.gateway.outputs.digest }}
      sandbox_image: ${{ steps.images.outputs.sandbox }}@${{ steps.sandbox.outputs.digest }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: 🚧 Check production activation availability
        run: |
          echo "Production activation is unavailable after the Boxie split; split-service release/deployment support lands in PR4. Use the documented local Compose units for validation." >&2
          exit 1
      - name: 📥 Check out reviewed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 🏷️ Choose image names and unique release tag
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            printf 'gateway=ghcr.io/%s-playground-gateway\n' "${REPOSITORY,,}"
            printf 'sandbox=ghcr.io/%s-playground-sandbox\n' "${REPOSITORY,,}"
            printf 'tag=run-%s-%s\n' "$RUN_ID" "$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: 🔐 Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 🏗️ Build and publish gateway and frontend image
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/cli-playground/infra/Playground.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.gateway }}:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: 🏗️ Build and publish shared sandbox image
        id: sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/cli-playground/Sandbox.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.sandbox }}:${{ steps.images.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: 📝 Record immutable runtime image digests
        env:
          REVISION: ${{ github.sha }}
          GATEWAY_IMAGE: ${{ steps.images.outputs.gateway }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          SANDBOX_IMAGE: ${{ steps.images.outputs.sandbox }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          revision = os.environ["REVISION"]
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("Invalid release revision")
          release = {"revision": revision}
          for image in ("gateway", "sandbox"):
              name = os.environ[f"{image.upper()}_IMAGE"]
              digest = os.environ[f"{image.upper()}_DIGEST"]
              if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit(f"Invalid {image} image digest")
              release[f"{image}_image"] = f"{name}@{digest}"
          payload = json.dumps(release, indent=2) + "\n"
          Path("release.json").write_text(payload, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Playground runtime release\n\n")
              summary.write("```json\n" + payload + "```\n\n")
              summary.write(
                  "The runtime deployment job applies these exact digests to the existing host.\n"
              )
          PY
      - name: 📤 Upload immutable release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-playground-release
          path: release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  deploy:
    name: 🚀 Deploy playground runtime and verify HTTPS
    needs: release
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: playground
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: cli-playground-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: 'true'
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      # Read SSH identity from R2; DNS renewal credentials reach only Traefik.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      PLAYGROUND_DEPLOY_TOKEN: ${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}
    steps:
      - name: 📥 Check out reviewed deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: 📦 Install locked Python workspace dependencies
        run: uv sync --locked --all-packages
      - name: ☁️ Set up Pulumi infrastructure tooling
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2
        with:
          pulumi-version: '3.268.0'
      - name: 🚀 Deploy immutable images and verify HTTPS
        env:
          RELEASE_REVISION: ${{ needs.release.outputs.revision }}
          GATEWAY_IMAGE: ${{ needs.release.outputs.gateway_image }}
          SANDBOX_IMAGE: ${{ needs.release.outputs.sandbox_image }}
          GHCR_TOKEN: ${{ github.token }}
        run: uv run --locked python -m playground_infra.ci deploy
