name: 🚀 Playground runtime release
'on':
  push:
    branches:
    - master
    paths:
    - tools/cli-playground/src/playground/**
    - tools/cli-playground/frontend/**
    - tools/cli-playground/fixtures/**
    - tools/cli-playground/infra/Playground.Dockerfile*
    - tools/cli-playground/Sandbox.Dockerfile*
    - tools/cli-playground/shell.sh
    - tools/cli-playground/infra/compose.production.yml
    - tools/cli-playground/pyproject.toml
    - tools/cli-playground/infra/deploy.sh
    - tools/cli-playground/infra/playground_infra/installation.py
    - .github/workflows/cli-playground-release.yml
    - pyproject.toml
    - uv.lock
    - .python-version
    - .dockerignore
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: playground-release
  cancel-in-progress: false
jobs:
  release:
    name: 📦 Build and publish playground runtime images
    if: ${{ github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true' && vars.BOXIE_BACKUP_RESTORE_VERIFIED
      == 'true' && (github.event_name != 'push' || vars.PLAYGROUND_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ github.sha }}
      changed: ${{ steps.select.outputs.runtime }}
      sandbox_changed: ${{ steps.select.outputs.sandbox }}
      gateway_image: ${{ steps.gateway.outputs.digest && format('{0}@{1}', steps.images.outputs.gateway, steps.gateway.outputs.digest)
        || '' }}
      sandbox_image: ${{ steps.sandbox.outputs.digest && format('{0}@{1}', steps.images.outputs.sandbox, steps.sandbox.outputs.digest)
        || '' }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
    - name: 📥 Check out reviewed release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: 'false'
        fetch-depth: 0
    - name: Select affected runtime images
      id: select
      env:
        APP: playground
      run: python3 tools/boxie/infra/boxie_infra/release_selection.py "$APP" "" >> "$GITHUB_OUTPUT"
    - name: 🏷️ Choose image names and unique release tag
      id: images
      env:
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        {
          printf 'gateway=ghcr.io/%s-playground-gateway\n' "${REPOSITORY,,}"
          printf 'sandbox=ghcr.io/%s-playground-sandbox\n' "${REPOSITORY,,}"
          printf 'tag=run-%s-%s\n' "$RUN_ID" "$RUN_ATTEMPT"
        } >> "$GITHUB_OUTPUT"
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        cache-binary: 'false'
    - name: 🔐 Sign in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: 🏗️ Build and publish gateway and frontend image
      id: gateway
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: tools/cli-playground/infra/Playground.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: ${{ steps.images.outputs.gateway }}:${{ steps.images.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
      if: ${{ steps.select.outputs.runtime == 'true' }}
    - name: 🏗️ Build and publish shared sandbox image
      id: sandbox
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: tools/cli-playground/Sandbox.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: ${{ steps.images.outputs.sandbox }}:${{ steps.images.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
      if: ${{ steps.select.outputs.sandbox == 'true' }}
  deploy:
    name: Deploy playground
    needs: release
    if: ${{ github.ref == 'refs/heads/master' && (needs.release.outputs.changed == 'true' || needs.release.outputs.sandbox_changed
      == 'true') }}
    environment: playground
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: clis-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
    - name: Check out reviewed deployment source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Copy release and run bounded host operation
      env:
        GATEWAY_IMAGE: ${{ needs.release.outputs.gateway_image }}
        SANDBOX_IMAGE: ${{ needs.release.outputs.sandbox_image }}
        DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        GHCR_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        run="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        [[ $run =~ ^[0-9]+-[0-9]+$ && $GITHUB_SHA =~ ^[a-f0-9]{40}$ ]]
        [[ $DEPLOY_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
        private=$(mktemp -d)
        trap 'rm -rf "$private"' EXIT
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$private/key"
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$private/known_hosts"
        cat > "$private/config" <<EOF
        Host deployment
          HostName $DEPLOY_HOST
          User root
          IdentityFile $private/key
          IdentitiesOnly yes
          UserKnownHostsFile $private/known_hosts
          StrictHostKeyChecking yes
          BatchMode yes
          ConnectTimeout 15
          ServerAliveInterval 15
          ServerAliveCountMax 3
        EOF
        current=$(ssh -F "$private/config" deployment 'cat /srv/clis/deployment/playground/current/revision')
        [[ $current =~ ^[a-f0-9]{40}$ ]]
        git merge-base --is-ancestor "$current" "$GITHUB_SHA" || { echo 'Refusing to replace a newer or unrelated release.' >&2; exit 1; }
        selection=$(python3 tools/boxie/infra/boxie_infra/release_selection.py playground "$current")
        if [[ $selection != *runtime=true* && $selection != *sandbox=true* ]]; then
            echo 'No runtime changes since the successful deployment.'
            exit 0
        fi
        [[ $selection == *runtime=true* ]] || GATEWAY_IMAGE=
        [[ $selection == *sandbox=true* ]] || SANDBOX_IMAGE=
        mkdir -p "$private/payload/tools/cli-playground"
        cp -a tools/cli-playground/infra "$private/payload/tools/cli-playground/infra"
        printf '%s\n' "$GITHUB_SHA" > "$private/payload/revision"
        printf '%s\n' "$current" > "$private/payload/expected-revision"
        if [[ -n $GATEWAY_IMAGE ]]; then
            touch "$private/payload/gateway.changed"
        else
            GATEWAY_IMAGE=$(ssh -F "$private/config" deployment 'sed -n "s/^PLAYGROUND_IMAGE=//p" /srv/clis/deployment/playground/current/image.env')
        fi
        [[ $GATEWAY_IMAGE =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
        printf 'PLAYGROUND_IMAGE=%s\n' "$GATEWAY_IMAGE" > "$private/payload/image.env"
        if [[ -n $SANDBOX_IMAGE ]]; then
            [[ $SANDBOX_IMAGE =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
            boxie=$(ssh -F "$private/config" deployment 'cat /srv/clis/deployment/boxie/current/revision')
            [[ $boxie =~ ^[a-f0-9]{40}$ ]]
            printf '%s\n' "$boxie" > "$private/payload/expected-boxie-revision"
            touch "$private/payload/sandbox.changed"
        else
            SANDBOX_IMAGE=$(ssh -F "$private/config" deployment 'sed -n "s/^PLAYGROUND_SANDBOX_IMAGE=//p" /srv/clis/deployment/playground/current/image.env')
        fi
        [[ $SANDBOX_IMAGE =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
        printf 'PLAYGROUND_SANDBOX_IMAGE=%s\n' "$SANDBOX_IMAGE" >> "$private/payload/image.env"
        # The token is restricted to package reads and never appears in the remote command.
        mkdir "$private/payload/registry"
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$private/payload/registry/config.json"
        ssh -F "$private/config" deployment "test ! -e /opt/clis/releases/playground/$run && install -d -m 0700 /opt/clis/staging/playground/$run /opt/clis/releases/playground"
        scp -F "$private/config" -r "$private/payload" "deployment:/opt/clis/staging/playground/$run/"
        ssh -F "$private/config" deployment "mv /opt/clis/staging/playground/$run/payload /opt/clis/releases/playground/$run"
        unit="clis-playground@$run.service"
        echo "Operation: $unit" >> "$GITHUB_STEP_SUMMARY"
        ssh -F "$private/config" deployment "systemctl start $unit" || { echo "Operation outcome requires inspection: systemctl show $unit; journalctl -u $unit" >&2; exit 1; }
        ssh -F "$private/config" deployment "test \"\$(systemctl show $unit -p Result --value)\" = success && test \"\$(systemctl show $unit -p SubState --value)\" = exited && test \"\$(systemctl show $unit -p ExecMainStatus --value)\" = 0 && test \"\$(cat /srv/clis/deployment/playground/current/revision)\" = $GITHUB_SHA && test ! -e /srv/clis/deployment/pending"
