name: 🚀 CLI Playground Release
'on':
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: sanctuary-production
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: 📥 Select current master
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      attempt: ${{ steps.revision.outputs.attempt }}
    steps:
      - name: 📥 Check out current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
      - name: 🔎 Record the source commit
        id: revision
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  gateway:
    needs: source
    uses: ./.github/workflows/build-runtime-image.yml # zizmor: ignore[self-repository]
    with:
      component: playground-gateway
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
  deploy-gateway:
    name: 🚀 Update Playground with Compose
    needs: [source, gateway]
    if: ${{ github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true' }}
    environment: playground
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔎 Require a complete workflow retry
        env:
          SOURCE_ATTEMPT: ${{ needs.source.outputs.attempt }}
        run: |
          if [[ -z $SOURCE_ATTEMPT || $SOURCE_ATTEMPT != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'Use Re-run all jobs or start a new workflow run to select current master.' >&2
            exit 1
          fi
      - name: 📥 Check out the built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: 🚀 Copy gateway files and run Compose
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          BUILT_SHA: ${{ needs.gateway.outputs.source_sha }}
          IMAGE: ${{ needs.gateway.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash infra/environments/single-host/release.sh gateway
