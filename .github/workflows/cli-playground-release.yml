name: 🚀 Playground gateway release
'on':
  push:
    branches: [master]
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: clis-production
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: 📥 Select current master
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      attempt: ${{ steps.revision.outputs.attempt }}
      changed: ${{ steps.selection.outputs.changed }}
    steps:
      - name: 📥 Check out current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0
      - name: 🔎 Record the source commit
        id: revision
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
          enable-cache: false
      - name: 📍 Resolve workspace packages
        id: projects
        run: |
          set -euo pipefail
          boxie=$(uv workspace dir --package boxie)
          playground=$(uv workspace dir --package cli-playground)
          printf 'boxie=%s\nplayground=%s\n' "$boxie" "$playground" >> "$GITHUB_OUTPUT"
      - name: 🔎 Select affected runtime component
        id: selection
        env:
          OWNER_PACKAGE: cli-playground
          SELECTED_SHA: ${{ steps.revision.outputs.sha }}
          BOXIE_DIR: ${{ steps.projects.outputs.boxie }}
          PLAYGROUND_DIR: ${{ steps.projects.outputs.playground }}
          OWNER_INPUTS: '["src/playground/**", "frontend/**", "pyproject.toml", "infra/Playground.Dockerfile*", "infra/compose.production.yml", "infra/deploy.sh", "infra/routes.yml"]'
        run: |
          set -euo pipefail
          python3 - <<'PYSELECT'
          import json
          import fnmatch
          import os
          import pathlib
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          base = event.get("pull_request", {}).get("base", {}).get("sha") or event.get("before")
          head = os.environ.get("SELECTED_SHA") or os.environ["GITHUB_SHA"]
          changed = True
          if base and set(base) != {"0"}:
              comparison = f"{base}...{head}" if "pull_request" in event else f"{base}..{head}"
              result = subprocess.run(["git", "diff", "--name-only", "--no-renames", "-z", comparison], check=True, capture_output=True)
              paths = [os.fsdecode(value) for value in result.stdout.split(b"\0") if value]
              root = pathlib.Path.cwd().resolve()
              packages = [pathlib.Path(os.environ[name]).resolve().relative_to(root).as_posix() for name in ("BOXIE_DIR", "PLAYGROUND_DIR")]
              owner = os.environ.get("OWNER_PACKAGE")
              if owner:
                  packages = packages[:1] if owner == "boxie" else packages[1:]
              global_inputs = {"Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "pyproject.toml", "uv.lock", ".python-version", ".dockerignore"}
              changed = any(path in global_inputs or path.startswith(".github/workflows/") or (not owner and path.endswith(".rs")) or any(path.startswith(directory + "/") and not path.endswith(".md") and (not owner or any(fnmatch.fnmatchcase(path[len(directory) + 1:], pattern) for pattern in json.loads(os.environ["OWNER_INPUTS"]))) for directory in packages) for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"changed={str(changed).lower()}", file=output)
          PYSELECT
  build:
    needs: source
    uses: ./.github/workflows/build-runtime-image.yml # zizmor: ignore[self-repository]
    with:
      component: playground-gateway
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
    if: ${{ needs.source.outputs.changed == 'true' }}
  deploy:
    name: 🚀 Update Playground with Compose
    needs: [source, build]
    if: ${{ github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true' && vars.BOXIE_BACKUP_RESTORE_VERIFIED == 'true' && (github.event_name != 'push' || vars.PLAYGROUND_AUTO_DEPLOY == 'true') }}
    environment: playground
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔎 Require a complete workflow retry
        env:
          SOURCE_ATTEMPT: ${{ needs.source.outputs.attempt }}
        run: |
          if [[ -z $SOURCE_ATTEMPT || $SOURCE_ATTEMPT != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'Use Re-run all jobs or start a new workflow run to select current master.' >&2
            exit 1
          fi
      - name: 📥 Check out the built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
          enable-cache: false
      - name: 📍 Resolve workspace packages
        id: projects
        run: |
          set -euo pipefail
          boxie=$(uv workspace dir --package boxie)
          playground=$(uv workspace dir --package cli-playground)
          printf 'boxie=%s\nplayground=%s\n' "$boxie" "$playground" >> "$GITHUB_OUTPUT"
      - name: 🚀 Copy gateway files and run Compose
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
          GATEWAY_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
          BOXIE_DIR: ${{ steps.projects.outputs.boxie }}
          PLAYGROUND_DIR: ${{ steps.projects.outputs.playground }}
        run: |
          set -euo pipefail
          umask 077
          [[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ && $BUILT_SHA == "$SOURCE_SHA" ]]
          [[ $(git rev-parse HEAD) == "$SOURCE_SHA" ]]
          [[ $GATEWAY_IMAGE =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          [[ $DEPLOY_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          [[ $GITHUB_RUN_ID =~ ^[0-9]+$ && $GITHUB_RUN_ATTEMPT =~ ^[0-9]+$ ]]
          private=$(mktemp -d)
          trap 'rm -rf "$private"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$private/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$private/known_hosts"
          cat > "$private/config" <<SSH
          Host deployment
            HostName $DEPLOY_HOST
            User root
            IdentityFile $private/key
            IdentitiesOnly yes
            UserKnownHostsFile $private/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          SSH
          remote="/run/clis-playground-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$private/config" deployment "install -d -m 0700 /opt/clis/playground $remote"
          scp -F "$private/config" -r "${PLAYGROUND_DIR}/infra/." deployment:/opt/clis/playground/
          sandbox=$(ssh -F "$private/config" deployment "sed -n 's/^PLAYGROUND_SANDBOX_IMAGE=//p' /etc/clis/playground-image.env")
          [[ $sandbox =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          printf 'PLAYGROUND_IMAGE=%s\nPLAYGROUND_SANDBOX_IMAGE=%s\n' "$GATEWAY_IMAGE" "$sandbox" > "$private/image.env"
          mkdir "$private/registry"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$private/registry/config.json"
          scp -F "$private/config" "$private/image.env" deployment:"$remote/image.env"
          scp -F "$private/config" -r "$private/registry" deployment:"$remote/registry"
          ssh -F "$private/config" deployment "set -e; trap 'rm -rf $remote' EXIT; install -m 0600 $remote/image.env /etc/clis/playground-image.env; DOCKER_CONFIG=$remote/registry bash /opt/clis/playground/deploy.sh"
