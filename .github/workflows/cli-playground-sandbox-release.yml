name: 🚀 Playground sandbox release
'on':
  push:
    branches: [master]
    paths:
      - tools/cli-playground/Sandbox.Dockerfile*
      - tools/cli-playground/shell.sh
      - tools/cli-playground/fixtures/**
      - tools/cli-playground/infra/profiles/playground.json
      - tools/cli-playground/infra/playground_infra/installation.py
      - tools/cli-playground/infra/sandbox-release.sh
      - .github/workflows/cli-playground-sandbox-release.yml
      - .github/workflows/build-runtime-image.yml
      - .dockerignore
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: clis-production
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: 📥 Select current master
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      attempt: ${{ steps.revision.outputs.attempt }}
    steps:
      - name: 📥 Check out current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
      - name: 🔎 Record the source commit
        id: revision
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    uses: ./.github/workflows/build-runtime-image.yml # zizmor: ignore[self-repository]
    with:
      component: playground-sandbox
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
  deploy:
    name: 🚀 Update Playground sandbox
    needs: [source, build]
    if: ${{ github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true' && vars.BOXIE_BACKUP_RESTORE_VERIFIED == 'true' && (github.event_name != 'push' || vars.PLAYGROUND_AUTO_DEPLOY == 'true') }}
    environment: playground
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔎 Require a complete workflow retry
        env:
          SOURCE_ATTEMPT: ${{ needs.source.outputs.attempt }}
        run: |
          if [[ -z $SOURCE_ATTEMPT || $SOURCE_ATTEMPT != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'Use Re-run all jobs or start a new workflow run to select current master.' >&2
            exit 1
          fi
      - name: 📥 Check out the built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: 🚀 Copy profile files and recreate the orchestrator
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
          SANDBOX_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ && $BUILT_SHA == "$SOURCE_SHA" ]]
          [[ $(git rev-parse HEAD) == "$SOURCE_SHA" ]]
          [[ $SANDBOX_IMAGE =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          [[ $DEPLOY_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          [[ $GITHUB_RUN_ID =~ ^[0-9]+$ && $GITHUB_RUN_ATTEMPT =~ ^[0-9]+$ ]]
          private=$(mktemp -d)
          trap 'rm -rf "$private"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$private/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$private/known_hosts"
          cat > "$private/config" <<SSH
          Host deployment
            HostName $DEPLOY_HOST
            User root
            IdentityFile $private/key
            IdentitiesOnly yes
            UserKnownHostsFile $private/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          SSH
          remote="/run/clis-sandbox-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$private/config" deployment "install -d -m 0700 /opt/clis/playground $remote"
          scp -F "$private/config" -r tools/cli-playground/infra/. deployment:/opt/clis/playground/
          gateway=$(ssh -F "$private/config" deployment "sed -n 's/^PLAYGROUND_IMAGE=//p' /etc/clis/playground-image.env")
          [[ $gateway =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          printf 'PLAYGROUND_IMAGE=%s\nPLAYGROUND_SANDBOX_IMAGE=%s\n' "$gateway" "$SANDBOX_IMAGE" > "$private/image.env"
          mkdir "$private/registry"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$private/registry/config.json"
          scp -F "$private/config" "$private/image.env" deployment:"$remote/image.env"
          scp -F "$private/config" -r "$private/registry" deployment:"$remote/registry"
          ssh -F "$private/config" deployment "set -e; trap 'rm -rf $remote' EXIT; install -m 0600 $remote/image.env /etc/clis/playground-image.env; DOCKER_CONFIG=$remote/registry bash /opt/clis/playground/sandbox-release.sh $SANDBOX_IMAGE"
