name: Benchmarks

on:
  schedule:
    - cron: '43 4 * * 2'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Previous Rust ref (empty selects the candidate parent)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tail:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            reference: /usr/bin/tail
          - os: macos-15
            platform: macos
            reference: /opt/homebrew/bin/gtail
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: hyperfine@1.20.0
          fallback: none
      - if: runner.os == 'macOS'
        run: brew install coreutils
      - name: Select immutable baseline and compiler
        env:
          BASELINE_REF: ${{ inputs.baseline }}
        run: |
          mkdir -p target/benchmark-evidence target/baseline-src
          git rev-parse HEAD > target/benchmark-evidence/candidate-sha.txt
          git rev-parse --verify --end-of-options "${BASELINE_REF:-HEAD^}^{commit}" > target/benchmark-evidence/baseline-sha.txt
          git archive "$(cat target/benchmark-evidence/baseline-sha.txt)" | tar -x -C target/baseline-src
          echo "RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_ENV"
      - name: Record hardware and build policy
        run: |
          rustc -Vv > target/benchmark-evidence/environment.txt
          uname -a >> target/benchmark-evidence/environment.txt
          df -h . >> target/benchmark-evidence/environment.txt
          if [[ "$RUNNER_OS" == Linux ]]; then
            lscpu >> target/benchmark-evidence/environment.txt
            free -h >> target/benchmark-evidence/environment.txt
          else
            sysctl hw.model hw.memsize hw.ncpu machdep.cpu.brand_string >> target/benchmark-evidence/environment.txt
          fi
          echo 'release, default features, no custom RUSTFLAGS, warm cache, no memory measurement' >> target/benchmark-evidence/environment.txt
      - name: Build both revisions separately
        run: |
          cargo build --locked --release -p tailr -p biggie --target-dir target/benchmark-candidate
          cargo build --locked --release -p tailr --manifest-path target/baseline-src/Cargo.toml --target-dir target/benchmark-baseline
      - name: Check correctness then measure
        env:
          REFERENCE: ${{ matrix.reference }}
        run: |
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then extra+=(--smoke); fi
          python3 scripts/benchmark_tail.py \
            --candidate "$PWD/target/benchmark-candidate/release/tailr" \
            --baseline "$PWD/target/benchmark-baseline/release/tailr" \
            --generator "$PWD/target/benchmark-candidate/release/biggie" --reference "$REFERENCE" \
            --candidate-revision "$(cat target/benchmark-evidence/candidate-sha.txt)" \
            --baseline-revision "$(cat target/benchmark-evidence/baseline-sha.txt)" \
            --generator-revision "$(cat target/benchmark-evidence/candidate-sha.txt)" \
            --candidate-lockfile Cargo.lock --baseline-lockfile target/baseline-src/Cargo.lock --generator-lockfile Cargo.lock \
            --cases coreutils/tailr/benches/cases.json --output-dir target/benchmark-evidence/tail "${extra[@]}"
      - name: Instrumentation overhead with identical stderr sink
        if: runner.os == 'Linux'
        run: |
          cargo bench --locked -p cli-tracing --bench overhead --no-run
          cargo bench --locked -p cli-tracing --bench overhead -- --bare --log-level=off > target/benchmark-evidence/overhead-bare.csv 2>/dev/null
          cargo bench --locked -p cli-tracing --bench overhead -- --log-level=off > target/benchmark-evidence/overhead-off.csv 2>/dev/null
          cargo bench --locked -p cli-tracing --bench overhead -- --log-level=debug > target/benchmark-evidence/overhead-debug.csv 2>/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: benchmarks-${{ matrix.platform }}
          path: target/benchmark-evidence/
          retention-days: 30
          if-no-files-found: error
