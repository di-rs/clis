name: 🐳 Build Sanctuary component image
'on':
  workflow_call:
    inputs:
      component:
        description: "Image to build: boxie, cli-playground, boxie-sandbox, or collector"
        required: true
        type: string
      revision:
        required: true
        type: string
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      source_sha:
        value: ${{ jobs.build.outputs.source_sha }}
permissions: {}
jobs:
  build:
    name: 🐳 Build ${{ inputs.component }} image
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
    - name: 📥 Check out reviewed source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: 'false'
    - name: Select a fixed component and identify its source
      id: source
      env:
        COMPONENT: ${{ inputs.component }}
        REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        [[ $REVISION =~ ^[a-f0-9]{40}$ ]]
        case $COMPONENT in
          boxie|cli-playground|boxie-sandbox|collector) ;;
          *) echo 'Unknown image component' >&2; exit 2 ;;
        esac
        sha=$(git rev-parse HEAD)
        [[ $sha == "$REVISION" ]]
        printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
    - name: Choose image build inputs
      id: image
      env:
        COMPONENT: ${{ inputs.component }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        case $COMPONENT in
          boxie) file=packages/boxie/infra/Boxie.Dockerfile; context=. ;;
          cli-playground) file=tools/cli-playground/infra/docker/CliPlayground.Dockerfile; context=. ;;
          boxie-sandbox) file=packages/boxie/sandbox/Dockerfile; context=. ;;
          collector) file=packages/boxie/infra/observability/collector/Dockerfile; context=packages/boxie/infra/observability/collector ;;
        esac
        printf 'file=%s\ncontext=%s\nname=ghcr.io/%s-%s\n' "$file" "$context" "${REPOSITORY,,}" "$COMPONENT" >> "$GITHUB_OUTPUT"
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        cache-binary: 'false'
    - name: 🔐 Sign in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build and publish image
      id: publish
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: ${{ steps.image.outputs.context }}
        file: ${{ steps.image.outputs.file }}
        platforms: linux/amd64
        push: 'true'
        tags: ${{ steps.image.outputs.name }}:run-${{ github.run_id }}-${{ github.run_attempt }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
    - name: Record immutable image
      env:
        IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
      run: printf '%s from %s\n' "$IMAGE" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
