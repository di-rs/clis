name: 🧰 Scheduled repository maintenance

on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: 📦 Refresh dependency vulnerability and license checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install dependency audit tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-machete@0.9.2
          fallback: none
      - name: 🛡️ Refresh vulnerability, license and dependency checks
        run: |
          for manifest in Cargo.toml tests/consumers/Cargo.toml; do
            cargo audit --db "$RUNNER_TEMP/advisory-db" --file "${manifest%Cargo.toml}Cargo.lock" --deny yanked
            cargo deny --locked --manifest-path "$manifest" --config "$PWD/deny.toml" check licenses sources bans
          done
          cargo machete --with-metadata

  remote-links:
    name: 🔗 Check external documentation links
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔗 Install checksum-verified link checker
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/lychee.tar.gz"
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: 🔗 Validate remote Markdown links and anchors
        run: git ls-files -z -- '*.md' | xargs -0 lychee --include-fragments=anchor-only --

  coverage:
    name: 📊 Collect Rust test coverage
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: 🛠️ Install Rust test and coverage tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1
          fallback: none
      - name: 📝 Record coverage environment and revision
        run: |
          mkdir -p target/coverage
          rustc -Vv > target/coverage/environment.txt
          uname -a >> target/coverage/environment.txt
          git rev-parse HEAD >> target/coverage/environment.txt
      - name: 📊 Collect workspace test coverage
        run: cargo llvm-cov nextest --locked --workspace --all-features --lcov --output-path target/coverage/lcov.info
      - name: 📊 Generate HTML coverage report
        run: cargo llvm-cov report --html --output-dir target/coverage
      - name: 📤 Upload coverage data and HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: target/coverage/
          retention-days: 14
          if-no-files-found: error

  toolchains:
    name: 🦀 Rust compatibility (${{ matrix.toolchain }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly, stable, beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install selected Rust toolchain
        env:
          PROBE_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$PROBE_TOOLCHAIN" --profile minimal
      - name: 🛠️ Install Rust test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: 🏗️ Check workspace builds on selected toolchain
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustc -Vv
          cargo check --locked --workspace --all-targets
      - name: 🧪 Run tests and doctests on selected toolchain
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          cargo nextest run --locked --workspace --profile ci
          cargo test --locked --workspace --doc

  optimized-tests:
    name: ⚡ Rust release-mode tests and doctests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install Rust test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: ⚡ Run optimized Rust workspace tests
        run: cargo nextest run --locked --workspace --release --profile ci
      - name: 📚 Run optimized Rust documentation examples
        run: cargo test --locked --workspace --release --doc

  miri:
    name: 🔬 Check Rust memory safety with Miri
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install Miri and Rust sources
        run: rustup component add miri rust-src
      - name: 🔬 Prepare Miri interpreter
        run: cargo miri setup
      - name: 🔬 Check parser library with Miri
        run: cargo miri test --locked -p parsu --lib
      - name: 🔬 Check tail library consumer with Miri
        run: cargo miri test --locked -p tailr --test library
