name: Maintenance

on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: refreshed dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-machete@0.9.2
          fallback: none
      - run: bash scripts/check-dependencies.sh

  remote-links:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified lychee
        run: bash scripts/install-lychee.sh
      - run: git ls-files -z -- '*.md' | xargs -0 lychee --include-fragments=anchor-only --

  coverage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1
          fallback: none
      - name: Record environment
        run: |
          mkdir -p target/coverage
          rustc -Vv > target/coverage/environment.txt
          uname -a >> target/coverage/environment.txt
          git rev-parse HEAD >> target/coverage/environment.txt
      - name: Collect fresh coverage
        run: cargo llvm-cov nextest --locked --workspace --all-features --lcov --output-path target/coverage/lcov.info
      - name: HTML from the same collected data
        run: cargo llvm-cov report --html --output-dir target/coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: target/coverage/
          retention-days: 14
          if-no-files-found: error

  toolchains:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly, stable, beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install preview toolchain
        env:
          PROBE_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$PROBE_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Workspace build readiness
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustc -Vv
          cargo check --locked --workspace --all-targets
      - name: Workspace behavior readiness
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          cargo nextest run --locked --workspace --profile ci
          cargo test --locked --workspace --doc

  optimized-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - run: cargo nextest run --locked --workspace --release --profile ci
      - run: cargo test --locked --workspace --release --doc

  miri:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add miri rust-src
      - run: cargo miri setup
      - run: cargo miri test --locked -p parsu --lib
      - run: cargo miri test --locked -p tailr --test library
