name: New duplication advisory
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
permissions:
  contents: read
concurrency:
  group: duplication-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONPATH: tools
jobs:
  select:
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.paths.outputs.selected }}
      base: ${{ steps.paths.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/guardrails/tests -p test_scope.py
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -m guardrails.scope --base "$BASE"
          --patterns '*.rs' '*.py' '*.pyi' '*.js' '*.jsx' '*.ts' '*.tsx' '*.svelte'
          --present '*.rs' '*.py' '*.pyi' '*.js' '*.jsx' '*.ts' '*.tsx' '*.svelte'
          --config 'tools/guardrails/scripts.py' '.github/workflows/duplication.yml' 'tools/guardrails/duplication.py' 'tools/guardrails/changes.py' 'tools/guardrails/scope.py'
  check:
    name: New duplication advisory
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: ${{ needs.select.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tools/guardrails/tests -p test_scripts.py
      - run: python3 -m guardrails.duplication --base "$BASE"
