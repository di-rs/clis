name: 🛡️ CodeQL security analysis

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [master]
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml # zizmor: ignore[self-repository]

  analyze:
    needs: select
    if: needs.select.outputs.languages != '[]' && needs.select.outputs.languages != ''
    name: 🛡️ Analyze ${{ matrix.language }} security
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.select.outputs.languages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛡️ Initialize CodeQL security queries
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: 🔎 Analyze code and upload security results
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
