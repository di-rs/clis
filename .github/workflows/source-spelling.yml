name: Source spelling
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
permissions:
  contents: read
concurrency:
  group: source-spelling-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONPATH: tools
jobs:
  select:
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.paths.outputs.selected }}
      base: ${{ steps.paths.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/guardrails/tests -p test_scope.py
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -m guardrails.scope --base "$BASE"
          --patterns '*'
          --present '*'
          --config 'typos.toml' '.github/workflows/source-spelling.yml' 'tools/guardrails/source_spelling.py' 'tools/guardrails/changes.py' 'tools/guardrails/scope.py'
  check:
    name: Source spelling
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: ${{ needs.select.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: typos@1.50.3
          fallback: none
      - run: python3 -m guardrails.source_spelling --base "$BASE"
