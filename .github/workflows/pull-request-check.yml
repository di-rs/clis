name: Pull Request Check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: 🦀 Prek and doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Set up repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: 🛠️ Install check tools
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: prek@0.5.5,cargo-nextest@0.9.146
          fallback: none
      - name: 📦 Verify lockfile and fetch dependencies
        run: cargo fetch --locked
      - name: 🎨 Check formatting without modifying files
        run: cargo fmt -- --check
      - name: ✅ Run every configured prek hook
        run: prek run --all-files --show-diff-on-failure
      - name: 📚 Run documentation tests
        run: cargo test --workspace --doc --locked
      - name: 🧹 Verify checks left tracked files unchanged
        run: git diff --exit-code

  dependencies:
    name: 🛡️ Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install dependency auditor
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: 🛡️ Audit the workspace lockfile against RustSec
        run: cargo audit --file Cargo.lock

  workflows:
    name: 🔍 Workflow lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install workflow security auditor
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: zizmor@1.30.1
          fallback: none
      - name: 🛠️ Install pinned workflow linter
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: 🔍 Lint workflow syntax and shell commands
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: 🛡️ Audit workflow security without tokens
        run: zizmor --offline --no-progress .github/workflows

  secrets:
    name: 🔐 Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🛠️ Install pinned secret scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: 🔐 Scan reachable history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'
