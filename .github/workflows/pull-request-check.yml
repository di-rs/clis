name: ✅ Pull request validation

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  select:
    name: Select affected checks
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      python: ${{ steps.paths.outputs.python }}
      frontend: ${{ steps.paths.outputs.frontend }}
      source: ${{ steps.paths.outputs.source }}
      shell: ${{ steps.paths.outputs.shell }}
      yaml: ${{ steps.paths.outputs.yaml }}
      markdown: ${{ steps.paths.outputs.markdown }}
      spelling: ${{ steps.paths.outputs.spelling }}
      python_audit: ${{ steps.paths.outputs.python_audit }}
      frontend_audit: ${{ steps.paths.outputs.frontend_audit }}
      actions: ${{ steps.paths.outputs.actions }}
      languages: ${{ steps.paths.outputs.languages }}
      base: ${{ steps.paths.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          PYTHONPATH: tools
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE=$(git rev-parse HEAD^)
          fi
          python3 -m guardrails select --base "$BASE"
  quality:
    needs: select
    if: >-
      ${{
        needs.select.outputs.rust == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 🦀 Rust formatting, linting and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ♻️ Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - name: 🦀 Record Rust compiler version
        run: rustc -Vv
      - name: 🛠️ Install repository hooks
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: prek@0.5.5
          fallback: none
      - name: 📦 Fetch locked Rust dependencies
        run: cargo fetch
      - name: 🎨 Check Rust formatting
        run: cargo fmt --all -- --check
      - name: 🔍 Lint Rust code with Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -F unsafe_code
      - name: 📚 Build Rust API documentation
        run: cargo doc --workspace --all-features --no-deps
      - name: 🧹 Verify checks leave the checkout unchanged
        run: git diff --exit-code

  python:
    needs: select
    if: >-
      ${{
        needs.select.outputs.python == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 🐍 Python lint, types and tests (3.15)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: 🛠️ Install repository hooks
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: prek@0.5.5
          fallback: none
      - name: 📦 Install locked Python workspace dependencies
        run: uv sync --all-packages
      - name: 🔍 Lint Python with Ruff
        run: prek run ruff --all-files --show-diff-on-failure
      - name: 🎨 Check Python formatting
        run: prek run ruff-format --all-files --show-diff-on-failure
      - name: ♻️ Cache incremental Python type analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '**/pyproject.toml', '.python-version') }}-${{ hashFiles('packages/**/*.py', 'tools/**/*.py', 'infra/**/*.py', 'packages/**/*.pyi', 'tools/**/*.pyi', 'infra/**/*.pyi') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '**/pyproject.toml', '.python-version') }}-
      - name: 🔎 Check Python types with mypy
        run: prek run mypy --all-files --show-diff-on-failure
      - name: 🧪 Run Python regression tests
        run: uv run pytest
      - name: 🧹 Verify checks leave the checkout unchanged
        run: git diff --exit-code

  frontend:
    needs: select
    if: >-
      ${{
        needs.select.outputs.frontend == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 🎨 Frontend checks, builds and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/cli-playground/frontend
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🟢 Set up Node.js and frontend tooling
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          working-directory: tools/cli-playground/frontend
          node-version-file: .node-version
          version-file: package.json
          run-install: false
          cache: true
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: 📦 Install locked frontend dependencies
        run: pnpm install
      - name: 🔎 Check Svelte and TypeScript
        run: pnpm check
      - name: 🧪 Run frontend unit tests
        run: pnpm test
      - name: 🏗️ Build production frontend assets
        run: pnpm build
      - name: 📦 Verify isolated service packages and Compose topology
        working-directory: .
        run: |
          uv sync --all-packages
          uv run pytest packages/boxie/tests/test_packaging.py -m integration
      - name: 🌐 Install Chromium and browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: 🐘 Verify Playground PostgreSQL lifecycle
        working-directory: .
        run: uv run python tools/cli-playground/tests/run_integration.py
      - name: 🎭 Run browser end-to-end tests
        working-directory: .
        run: uv run pytest -m integration tools/cli-playground/tests/test_browser.py
      - name: 🧹 Verify checks leave the checkout unchanged
        run: git diff --exit-code

  tests:
    needs: select
    if: >-
      ${{
        needs.select.outputs.rust == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 🧪 Rust tests and doctests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ♻️ Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - name: 📝 Record compiler, platform and revision
        run: |
          mkdir -p target/ci
          rustc -Vv > target/ci/environment.txt
          uname -a >> target/ci/environment.txt
          git rev-parse HEAD >> target/ci/environment.txt
      - name: 🛠️ Install hooks and Rust test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: prek@0.5.5,cargo-nextest@0.9.146
          fallback: none
      - name: 📦 Fetch locked Rust dependencies
        run: cargo fetch
      - name: 🧪 Run Rust workspace tests
        run: cargo nextest run --workspace --hide-progress-bar --failure-output final | tee target/ci/tests.log
      - name: 📚 Run Rust documentation examples
        run: cargo test --workspace --doc | tee target/ci/doctests.log
      - name: 🧹 Verify tests leave the checkout unchanged
        run: git diff --exit-code
      - name: 📤 Upload test logs and JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.platform }}
          path: |
            target/ci/
            target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: error

  packages:
    needs: select
    if: >-
      ${{
        needs.select.outputs.rust == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 📦 Rust package and feature compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install Rust feature and test tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45,cargo-nextest@0.9.146
          fallback: none
      - name: 🦀 Record Rust compiler version
        run: rustc -Vv
      - name: ♻️ Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - name: 📦 Check every Rust package and target
        run: cargo hack check --workspace --all-targets
      - name: 🧩 Check Rust feature combinations
        run: cargo hack check --workspace --feature-powerset
      - name: 🧪 Test all Rust features
        run: cargo nextest run --workspace --all-features --profile ci
      - name: 📚 Test documentation with all features
        run: cargo test --workspace --all-features --doc
      - name: 🧹 Verify checks leave the checkout unchanged
        run: git diff --exit-code

  docs-policy:
    needs: select
    if: >-
      ${{
        needs.select.outputs.markdown == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 📚 Documentation links and spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install hooks and spelling checker
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: prek@0.5.5,typos@1.50.3
          fallback: none
      - name: 🔗 Install checksum-verified link checker
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/lychee.tar.gz"
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: 🔗 Check local documentation links and anchors
        run: prek run lychee --all-files --show-diff-on-failure
      - name: ✍️ Check documentation spelling
        run: prek run typos --all-files --show-diff-on-failure
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: 🧪 Verify hook selection and deleted links
        run: uv run pytest tools/cli-check/tests/test_prek.py -m integration
      - name: 🧹 Verify checks leave the checkout unchanged
        run: git diff --exit-code

  dependencies:
    needs: select
    if: >-
      ${{
        needs.select.outputs.rust == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 📦 Dependency vulnerabilities and license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install dependency audit tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-machete@0.9.2
          fallback: none
      - name: 🛡️ Audit vulnerabilities, licenses and dependency usage
        run: |
          cargo audit --db "$RUNNER_TEMP/advisory-db" --file Cargo.lock --deny yanked
          cargo deny check licenses sources bans
          cargo machete --with-metadata

  workflows:
    needs: select
    if: >-
      ${{
        needs.select.outputs.actions == 'true' &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 🛡️ Workflow syntax and security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install hooks and workflow security auditor
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: prek@0.5.5,zizmor@1.30.1
          fallback: none
      - name: 🛠️ Install checksum-verified workflow linter
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: 🔍 Lint workflow syntax and shell commands
        run: prek run actionlint --all-files --show-diff-on-failure
      - name: 🛡️ Audit workflow security without tokens
        run: prek run zizmor --all-files --show-diff-on-failure

  secrets:
    needs: select
    if: >-
      ${{
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    name: 🔐 Repository secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 📥 Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔐 Scan Git history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'

  repository-policy:
    needs: select
    if: needs.select.result == 'success'
    name: Repository file and CLI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: prek@0.5.5
          fallback: none
      - run: prek run check-added-large-files --all-files --show-diff-on-failure
      - if: needs.select.outputs.rust == 'true' || needs.select.outputs.markdown == 'true' || needs.select.outputs.python == 'true'
        run: uv run --frozen cli-check
