name: Pull Request Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compiler identity
        run: rustc -Vv
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: prek@0.5.5
          fallback: none
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: prek run check-added-large-files --all-files --show-diff-on-failure
      - run: prek run cargo-fmt --all-files --show-diff-on-failure
      - run: prek run cargo-clippy --all-files --show-diff-on-failure
      - run: prek run domain-clippy --all-files --show-diff-on-failure
      - run: cargo doc --locked --workspace --all-features --no-deps
      - run: git diff --exit-code

  tests:
    name: tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          mkdir -p target/ci
          rustc -Vv > target/ci/environment.txt
          uname -a >> target/ci/environment.txt
          git rev-parse HEAD >> target/ci/environment.txt
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: prek@0.5.5,cargo-nextest@0.9.146
          fallback: none
      - run: cargo fetch --locked
      - name: Workspace tests
        run: prek run cargo-nexttest --all-files --show-diff-on-failure | tee target/ci/tests.log
      - name: Doctests
        run: cargo test --locked --workspace --doc | tee target/ci/doctests.log
      - run: git diff --exit-code
      - name: Test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.platform }}
          path: |
            target/ci/
            target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: error

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-hack@0.6.45,cargo-nextest@0.9.146
          fallback: none
      - run: rustc -Vv
      - run: cargo hack check --locked --workspace --all-targets
      - run: cargo hack check --locked --workspace --feature-powerset
      - run: cargo nextest run --locked --workspace --all-features --profile ci
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo run --locked --manifest-path tests/consumers/Cargo.toml
      - run: git diff --exit-code

  docs-policy:
    name: docs-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: typos@1.50.3
          fallback: none
      - name: Install verified lychee
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/lychee.tar.gz"
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Local links and anchors
        run: git ls-files -z -- '*.md' | xargs -0 lychee --offline --include-fragments=anchor-only --
      - name: Prose spelling
        run: git ls-files -- '*.md' | typos --force-exclude --file-list -
      - run: git diff --exit-code

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install dependency auditor
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-machete@0.9.2
          fallback: none
      - name: Audit and enforce dependency policy
        run: |
          for manifest in Cargo.toml tests/consumers/Cargo.toml tools/fuzz/Cargo.toml; do
            cargo audit --db "$RUNNER_TEMP/advisory-db" --file "${manifest%Cargo.toml}Cargo.lock" --deny yanked
            cargo deny --locked --manifest-path "$manifest" --config "$PWD/deny.toml" check licenses sources bans
          done
          cargo machete --with-metadata

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install workflow security auditor
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: zizmor@1.30.1
          fallback: none
      - name: 🛠️ Install pinned workflow linter
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: 🔍 Lint workflow syntax and shell commands
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: 🛡️ Audit workflow security without tokens
        run: zizmor --offline --no-progress .github/workflows

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🛠️ Install pinned secret scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: 🔐 Scan reachable history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'
