name: 📜 PR title policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  git-policy:
    if: >-
      ${{
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    # This check name is required by branch protection; keep its context stable.
    name: git-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install Git policy hooks
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: prek@0.5.5
          fallback: none
      - name: 📜 Load pinned Gitmoji policy
        env:
          # Pin the policy independently of the PR checkout. Update after review.
          POLICY_COMMIT: 9da5407f9a30c1b2ed1687ed09435c3936ac51ad
        run: |
          git fetch --no-tags origin "$POLICY_COMMIT"
          mkdir -p "$RUNNER_TEMP/git-policy"
          git show "$POLICY_COMMIT:prek.toml" > "$RUNNER_TEMP/git-policy/prek.toml"
      - name: ✅ Validate PR squash title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/COMMIT_EDITMSG"
          prek run --config "$RUNNER_TEMP/git-policy/prek.toml" require-pattern --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/COMMIT_EDITMSG"
