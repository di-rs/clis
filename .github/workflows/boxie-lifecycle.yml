name: 🧪 Boxie lifecycle integration

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '.github/workflows/boxie-lifecycle.yml'
      - 'tools/cli-playground/**'
      - 'tools/boxie/**'
      - 'coreutils/echor/**'
      - 'utils/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  workflow_dispatch:
    inputs:
      deployment:
        description: Run the assembled production-manifest deployment gate
        type: boolean
        default: false
      capacity:
        description: Include the bounded eight-sandbox capacity observation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: boxie-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: 🧪 Verify PostgreSQL and Temporal lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.deployment || inputs.capacity) && 60 || 35 }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: 🛡️ Install signed gVisor and configure sandbox runtime
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl --fail --silent --show-error --location --max-time 60 https://gvisor.dev/archive.key \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main' \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install -- --platform=systrap --fdlimit=4096
          sudo systemctl restart docker
          runsc --version
      - name: 🏗️ Build shared sandbox and native CLI
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build -f tools/cli-playground/Sandbox.Dockerfile -t clis-playground-sandbox:lifecycle .
          cargo build --locked --release --package echor
      - name: 🐳 Build Boxie runtime image
        run: |
          docker build -f tools/boxie/infra/Runtime.Dockerfile -t boxie:lifecycle .
      - name: 🐳 Build playground runtime image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build -f tools/cli-playground/infra/Playground.Dockerfile -t cli-playground:lifecycle .
      - name: 🟢 Set up Node.js and frontend tooling
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: github.event_name == 'workflow_dispatch'
        with:
          working-directory: tools/cli-playground/frontend
          node-version-file: .node-version
          version-file: package.json
          run-install: false
          cache: false
      - name: 📦 Install locked Python workspace dependencies
        run: |
          uv sync --locked --all-packages
      - name: 🔄 Verify supporting installation and release projects
        timeout-minutes: 3
        run: |
          uv run --locked pytest -m integration tools/boxie/tests/test_supporting_release.py -vv
      - name: 🌐 Install frontend and Chromium dependencies
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm --dir tools/cli-playground/frontend install --frozen-lockfile
          pnpm --dir tools/cli-playground/frontend exec playwright install --with-deps chromium
      - name: ⏳ Verify Python imports and pinned Temporal test server
        timeout-minutes: 3
        run: |
          uv run --locked python -c 'import temporalio.bridge.temporal_sdk_bridge; import boxie.bootstrap.runtime'
          uv run --locked python - <<'PYTHON'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request
          pins = json.loads(pathlib.Path("tools/boxie/tests/test-server-pins.json").read_text())
          pin = next(p for p in pins["artifacts"] if p["variant"] == "linux_amd64")
          with urllib.request.urlopen(pin["url"], timeout=60) as source:
              archive = source.read()
          assert hashlib.sha256(archive).hexdigest() == pin["archive_sha256"]
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              source = tar.extractfile(pin["archive_member"])
              assert source is not None
              executable = source.read()
          assert hashlib.sha256(executable).hexdigest() == pin["binary_sha256"]
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "boxie-test-server"
          path.write_bytes(executable)
          path.chmod(0o700)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"BOXIE_TEST_SERVER={path}\n")
          PYTHON
          export BOXIE_TEST_SERVER="$RUNNER_TEMP/boxie-test-server"
          uv run --locked pytest -m integration tools/boxie/tests/test_temporal_lifecycle.py -vv --durations=10
      - name: 🗂️ Enable persistent journal for the collector smoke
        run: |
          sudo mkdir -p /var/log/journal
          sudo systemd-tmpfiles --create --prefix /var/log/journal
          sudo journalctl --flush
      - name: 🧪 Test PostgreSQL and Temporal cancellation, replay and diagnostics
        timeout-minutes: 9
        run: |
          uv run --locked pytest -m integration tools/boxie/tests/test_temporal_deployment.py tools/boxie/tests/test_outbox.py tools/boxie/tests/integration/test_artifact_commit.py tools/boxie/tests/test_migrations.py tools/boxie/tests/test_observability_lifecycle.py tools/boxie/tests/test_observability_logging.py tools/boxie/tests/test_observability_native.py -vv --durations=10
      - name: 🔐 Test native credential permissions and endpoint restarts
        timeout-minutes: 3
        run: |
          uv run --locked pytest -m integration tools/boxie/tests/test_native_permissions.py tools/boxie/tests/test_native_scenarios.py -vv --durations=10
      - name: 🗃️ Test PostgreSQL restart journal recovery
        timeout-minutes: 3
        run: |
          uv run --locked pytest -m integration tools/boxie/tests/test_postgres.py -k failed_restart_journal -vv --durations=10
      - name: 🔌 Verify real SSH disconnect cleanup
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deployment || inputs.capacity) }}
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          uv run --locked pytest -m integration tools/deploy/tests/deploy_checks/test_ssh_disconnect.py -vv
      - name: 🧪 Verify assembled owner releases and optional capacity
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deployment || inputs.capacity) }}
        timeout-minutes: 20
        env:
          OBSERVE_CAPACITY: ${{ inputs.capacity }}
        run: |
          args=(--deployment)
          if [[ $OBSERVE_CAPACITY == true ]]; then args+=(--capacity); fi
          sudo --preserve-env=PATH "$PWD/.venv/bin/python" tools/boxie/tests/run_integration.py "${args[@]}" -- -vv --durations=10
      - name: 📁 Collect only public assembled evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.deployment || inputs.capacity) }}
        run: |
          evidence="$RUNNER_TEMP/assembled-deployment-evidence"
          mkdir -p "$evidence"
          sudo "$PWD/.venv/bin/python" - "$evidence" <<'PYEVIDENCE'
          import pathlib, shutil, sys
          output = pathlib.Path(sys.argv[1])
          for pattern in ('evidence.json', 'cleanup-errors.log'):
              for source in pathlib.Path('/tmp/pytest-of-root').rglob(pattern):
                  target = output / (source.parent.parent.name + '-' + source.parent.name + '-' + source.name)
                  shutil.copyfile(source, target)
                  target.chmod(0o644)
          PYEVIDENCE
      - name: 📤 Preserve assembled evidence and cleanup diagnostics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.deployment || inputs.capacity) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assembled-deployment-evidence
          path: ${{ runner.temp }}/assembled-deployment-evidence/
          if-no-files-found: ignore
          retention-days: 14
      # Optional until the native suite's hang is resolved; never blocks a PR.
      - name: 🎭 Run optional native lifecycle and browser tests
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.deployment && !inputs.capacity }}
        timeout-minutes: 20
        run: |
          uv run --locked python tools/boxie/tests/run_integration.py --runtime runsc --browser -- -vv --durations=10 -o faulthandler_timeout=120
