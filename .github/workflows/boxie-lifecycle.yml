name: 🧪 Boxie lifecycle integration

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '.github/workflows/boxie-lifecycle.yml'
      - 'packages/boxie/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boxie-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: 🧪 Verify PostgreSQL and Temporal lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: 🛡️ Install signed gVisor and configure sandbox runtime
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl --fail --silent --show-error --location --max-time 60 https://gvisor.dev/archive.key \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main' \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install -- --platform=systrap --fdlimit=4096
          sudo systemctl restart docker
          runsc --version
      - name: 🏗️ Build Boxie sandbox
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build -f packages/boxie/sandbox/Dockerfile -t boxie-sandbox:lifecycle .
      - name: 🐳 Build Boxie image
        run: |
          docker build -f packages/boxie/infra/Boxie.Dockerfile -t boxie:lifecycle .
      - name: 📦 Install locked Python workspace dependencies
        run: |
          uv sync --locked --package sanctuary-tools --package boxie --package boxie-infra
      - name: ⏳ Verify Python imports and pinned Temporal test server
        timeout-minutes: 3
        run: |
          uv run --locked python -c 'import temporalio.bridge.temporal_sdk_bridge; import boxie.bootstrap.workers'
          uv run --locked python - <<'PYTHON'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request
          pins = json.loads(pathlib.Path("packages/boxie/tests/test-server-pins.json").read_text())
          pin = next(p for p in pins["artifacts"] if p["variant"] == "linux_amd64")
          with urllib.request.urlopen(pin["url"], timeout=60) as source:
              archive = source.read()
          assert hashlib.sha256(archive).hexdigest() == pin["archive_sha256"]
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              source = tar.extractfile(pin["archive_member"])
              assert source is not None
              executable = source.read()
          assert hashlib.sha256(executable).hexdigest() == pin["binary_sha256"]
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "boxie-test-server"
          path.write_bytes(executable)
          path.chmod(0o700)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"BOXIE_TEST_SERVER={path}\n")
          PYTHON
          export BOXIE_TEST_SERVER="$RUNNER_TEMP/boxie-test-server"
          uv run --locked pytest -m integration packages/boxie/tests/test_temporal_lifecycle.py -vv --durations=10
      - name: 🗂️ Enable persistent journal for the collector smoke
        run: |
          sudo mkdir -p /var/log/journal
          sudo systemd-tmpfiles --create --prefix /var/log/journal
          sudo journalctl --flush
      - name: 🧪 Test PostgreSQL and Temporal cancellation, replay and diagnostics
        timeout-minutes: 9
        run: |
          uv run --locked pytest -m integration packages/boxie/tests/test_temporal_deployment.py packages/boxie/tests/test_outbox.py packages/boxie/tests/integration/test_artifact_commit.py packages/boxie/tests/test_migrations.py packages/boxie/tests/test_rename_state.py packages/boxie/tests/test_observability_lifecycle.py packages/boxie/tests/test_observability_logging.py packages/boxie/tests/test_observability_native.py -vv --durations=10
      - name: 🔐 Test native credential permissions and endpoint restarts
        timeout-minutes: 3
        run: |
          uv run --locked pytest -m integration packages/boxie/tests/test_native_permissions.py packages/boxie/tests/test_native_scenarios.py -vv --durations=10
      - name: 🗃️ Test PostgreSQL restart journal recovery
        timeout-minutes: 3
        run: |
          uv run --locked pytest -m integration packages/boxie/tests/test_postgres.py -k failed_restart_journal -vv --durations=10
      # Optional until the native suite's hang is resolved; never blocks a PR.
      - name: 🎭 Run optional native lifecycle tests
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        run: |
          uv run --locked python packages/boxie/tests/run_integration.py --runtime runsc -- -vv --durations=10 -o faulthandler_timeout=120
