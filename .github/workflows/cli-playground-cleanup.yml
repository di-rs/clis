name: CLI playground lifecycle

# Execute only default-branch code. Event metadata selects a PR, never executable code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [master]
    types: [closed, reopened]

permissions: {}

# Close and reopen may arrive quickly; each run refetches the PR's current state.
concurrency:
  group: cli-playground-lifecycle-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lifecycle:
    if: ${{ github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.base.ref == 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Reconcile hosted PR playgrounds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}
          PLAYGROUND_DEPLOY_TOKEN: ${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}
        run: |
          uv run --locked --no-dev python tools/cli-playground/preview_ci.py lifecycle \
            --repo "$REPOSITORY" --pr "$PR_NUMBER" --action "$PR_ACTION"
