name: Rust changed-line coverage
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
permissions:
  contents: read
concurrency:
  group: rust-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONPATH: tools
jobs:
  select:
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.paths.outputs.selected }}
      base: ${{ steps.paths.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/guardrails/tests -p test_scope.py
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -m guardrails.scope --base "$BASE"
          --patterns '*.rs' '*Cargo.toml' '*Cargo.lock' '*rust-toolchain*' '.cargo/*' '.config/nextest.toml'
          --present '*.rs'
          --config '.github/workflows/rust-coverage.yml' 'tools/guardrails/rust_coverage.py' 'tools/guardrails/changes.py' 'tools/guardrails/scope.py'
  check:
    name: Rust changed-line coverage
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE: ${{ needs.select.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1
          fallback: none
      - run: rustup component add llvm-tools-preview
      - run: |
          mkdir -p target/coverage
          cargo llvm-cov nextest --workspace --all-features --lcov --output-path target/coverage/lcov.info
        env:
          NEXTEST_PROFILE: ci
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
      - run: uv tool run --from pytest==9.1.1 pytest -p no:cacheprovider -c /dev/null tools/guardrails/tests/test_coverage.py
      - run: python3 -m guardrails.rust_coverage --base "$BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-pr-coverage
          path: target/coverage/lcov.info
          retention-days: 14
