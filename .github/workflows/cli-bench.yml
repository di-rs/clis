name: ⏱️ CLI benchmark execution

# Keep this condition aligned with the first job: downstream workflows skip without a runner.
run-name: >-
  ${{
    (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) &&
    format('⏱️ CLI benchmarks for PR #{0}', github.event.pull_request.number) || '⏭️ CI skipped'
  }}

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  select:
    name: 🔎 Select CLIs with code changes
    if: >-
      ${{
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.selection.outputs.suites }}
      packages: ${{ steps.selection.outputs.packages }}
      runs: ${{ steps.selection.outputs.runs }}
      warmup: ${{ steps.selection.outputs.warmup }}
    steps:
      - name: 📥 Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: 🔎 Select only CLIs with code changes
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --locked --no-dev python tools/cli-bench/select_suites.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --event "$GITHUB_EVENT_PATH" > selection.json
          uv run --locked --no-dev python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection = json.loads(Path("selection.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for key in ("suites", "packages", "runs", "warmup"):
                  print(f"{key}={json.dumps(selection[key])}", file=output)
          PY
      - name: 📤 Upload benchmark selection details
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-bench-selection
          path: selection.json
          retention-days: 14
          if-no-files-found: error

  suites:
    name: ⏱️ Run CLI benchmarks (${{ matrix.os }})
    needs: select
    if: needs.select.outputs.suites != '[]'
    concurrency:
      group: cli-bench-${{ github.event.pull_request.number }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: ♻️ Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - name: ⏱️ Install Hyperfine benchmark runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: hyperfine@2.0.0
          fallback: none
      - name: 🏗️ Build selected CLI executables
        shell: bash
        env:
          PACKAGES: ${{ needs.select.outputs.packages }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import json
          import os
          import subprocess

          packages = json.loads(os.environ["PACKAGES"])
          if not packages:
              raise SystemExit("No CLI packages selected")
          subprocess.run([
              "cargo", "build", "--locked", "--release", "--bins",
              *[argument for package in packages for argument in ("-p", package)],
          ], check=True)
          PY
      - name: ⏱️ Execute selected benchmark suites
        shell: bash
        env:
          SUITES: ${{ needs.select.outputs.suites }}
          RUNS: ${{ needs.select.outputs.runs }}
          WARMUP: ${{ needs.select.outputs.warmup }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          suites = json.loads(os.environ["SUITES"])
          if not suites:
              raise SystemExit("No benchmark suites selected")
          failed = []
          for suite in suites:
              result = subprocess.run([
                  sys.executable, "tools/cli-bench/bench.py", suite,
                  "--warmup", os.environ["WARMUP"], "--runs", os.environ["RUNS"],
                  "--output", "target/benchmarks/" + suite.replace("/", "-"),
              ])
              if result.returncode:
                  failed.append(suite)
          if failed:
              raise SystemExit("Failed suites: " + ", ".join(failed))
          PY
      - name: 📤 Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-bench-${{ matrix.os }}
          path: target/benchmarks/
          retention-days: 14
          if-no-files-found: ignore
