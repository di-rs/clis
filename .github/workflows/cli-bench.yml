name: CLI benchmark suites

on:
  pull_request:
    paths: ["tools/cli-bench/**", "**/benches/*.toml", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/cli-bench.yml"]
  push:
    branches: [master]
    paths: ["tools/cli-bench/**", "**/benches/*.toml", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/cli-bench.yml"]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite TOML path (empty runs all suites)
        type: string
        default: coreutils/tailr/benches/cli-bench.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
      - run: uv sync --locked --all-packages
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: hyperfine@2.0.0
          fallback: none
      - name: Test runner
        run: uv run --locked python -m unittest discover -s tools/cli-bench -p 'test_*.py' -v
      - run: cargo build --locked --release --workspace --bins
      - name: Run suites
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          EVENT: ${{ github.event_name }}
        run: |
          runs=1
          warmup=0
          if [[ "$EVENT" == workflow_dispatch ]]; then
            runs=20
            warmup=3
          fi
          suites=(coreutils/*/benches/*.toml biggie/benches/*.toml calr/benches/*.toml parsu/benches/*.toml)
          if [[ -n "$SUITE" ]]; then suites=("$SUITE"); fi
          for suite in "${suites[@]}"; do
            uv run --locked python tools/cli-bench/bench.py "$suite" \
              --warmup "$warmup" --runs "$runs" \
              --output "target/benchmarks/${suite//\//-}"
          done
      - name: Benchmark reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-bench-${{ matrix.os }}
          path: target/benchmarks/
          retention-days: 14
          if-no-files-found: ignore
