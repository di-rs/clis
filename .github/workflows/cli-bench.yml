name: CLI benchmark

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA (blank uses selected workflow commit)
        type: string
        default: ''
      packages:
        description: Optional comma-separated packages (biggie,tailr,mkdirr); blank selects affected CLIs
        type: string
        default: ''
      target_sha:
        description: Exact target commit SHA; previous is its merge-base with candidate
        type: string
        required: true
  workflow_call:
    inputs:
      candidate_sha:
        description: Optional exact candidate SHA; cannot override PR identity
        type: string
        default: ''
      packages:
        description: Optional comma-separated packages (biggie,tailr,mkdirr); blank selects affected CLIs
        type: string
        default: ''
      target_sha:
        description: Exact comparison target SHA when overriding candidate or calling manually
        type: string
        default: ''

concurrency:
  group: cli-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: nightly-2026-10-04
  CARGO_TERM_COLOR: never
  # Every role uses the same inherited build environment and isolated Rust cache.
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''

jobs:
  select:
    name: Select exact revisions and affected CLIs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.selection.outputs.candidate_sha }}
      previous_sha: ${{ steps.selection.outputs.previous_sha }}
      packages: ${{ steps.impact.outputs.packages }}
      has_packages: ${{ steps.impact.outputs.has_packages }}
    steps:
      - name: Check out exact PR head or triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python runtime manager
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          python-version: '3.14'
          enable-cache: false
          github-token: ''
      - name: Install managed Python and copy CI adapters
        id: python
        run: |
          uv python install 3.14
          cp -R tools/cli-bench/ci "$RUNNER_TEMP/cli-bench-ci"
          uv sync --frozen --project "$RUNNER_TEMP/cli-bench-ci"
          {
            echo "BENCH_CI=$RUNNER_TEMP/cli-bench-ci"
            echo "BENCH_ROOT=$GITHUB_WORKSPACE/.cli-bench/ci"
            echo "BENCH_CLI=$GITHUB_WORKSPACE/target/release/cli-bench"
          } >> "$GITHUB_ENV"
          mkdir -p .cli-bench/ci/logs
      - name: Resolve comparison once
        id: selection
        env:
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: uv run --frozen --offline --project "$BENCH_CI" python "$BENCH_CI/selection.py" --output "$BENCH_ROOT/selection.json"
      - name: Select affected benchmark packages
        id: impact
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: uv run --frozen --offline --project "$BENCH_CI" python "$BENCH_CI/impact.py" --selection "$BENCH_ROOT/selection.json"

  tests:
    name: Unconditional tests (${{ matrix.platform }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos
    steps:
      - name: Check out exact PR head or triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python runtime manager
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          python-version: '3.14'
          enable-cache: false
          github-token: ''
      - name: Install managed Python and copy CI adapters
        id: python
        run: |
          uv python install 3.14
          cp -R tools/cli-bench/ci "$RUNNER_TEMP/cli-bench-ci"
          uv sync --frozen --project "$RUNNER_TEMP/cli-bench-ci"
          {
            echo "BENCH_CI=$RUNNER_TEMP/cli-bench-ci"
            echo "BENCH_ROOT=$GITHUB_WORKSPACE/.cli-bench/ci"
            echo "BENCH_CLI=$GITHUB_WORKSPACE/target/release/cli-bench"
          } >> "$GITHUB_ENV"
          mkdir -p .cli-bench/ci/logs
      - name: Validate exact test candidate independently of impact
        env:
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          uv run --frozen --offline --project "$BENCH_CI" python - <<'PYTHON'
          import os, subprocess, sys
          sys.path.insert(0, os.environ['BENCH_CI'])
          from selection import sha
          requested = os.environ.get('INPUT_CANDIDATE_SHA', '')
          if requested:
              if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
                  raise ValueError('PR identity cannot be overridden')
              if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha(requested):
                  raise ValueError('test checkout differs from exact candidate')
          PYTHON
      - name: Install one dated Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install exact test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Run CI adapter tests
        run: |
          uv run --frozen --offline --project "$BENCH_CI" python -m unittest discover -s tools/cli-bench/ci
          node --test tools/cli-bench/ci/test_comment.js
      - name: Run all workspace tests and doctests
        # Linux PR workspace tests already run in pull-request-check.yml without
        # changed-package filtering. Mac and every non-PR event need them here.
        if: ${{ matrix.platform == 'macos' || github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'master' }}
        run: |
          cargo nextest run --locked --workspace
          cargo test --locked --workspace --doc
      - name: Run all three explicit repository recipe acceptance tests
        run: CLIS_BENCH_WORKSPACE_MANIFEST="$PWD/Cargo.toml" cargo nextest run --locked -p cli-bench --run-ignored only -E 'test(repository_acceptance_)'

  smoke_linux:
    name: Smoke measurement (linux)
    needs: [select, tests]
    if: ${{ needs.select.outputs.has_packages == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLATFORM: linux
      MEASUREMENT_PROFILE: smoke
      BENCH_PACKAGES: ${{ needs.select.outputs.packages }}
      CANDIDATE_SHA: ${{ needs.select.outputs.candidate_sha }}
      PREVIOUS_SHA: ${{ needs.select.outputs.previous_sha }}
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Check out exact selected candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python runtime manager
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          python-version: '3.14'
          enable-cache: false
          github-token: ''
      - name: Install managed Python and copy CI adapters
        id: python
        run: |
          uv python install 3.14
          cp -R tools/cli-bench/ci "$RUNNER_TEMP/cli-bench-ci"
          uv sync --frozen --project "$RUNNER_TEMP/cli-bench-ci"
          {
            echo "BENCH_CI=$RUNNER_TEMP/cli-bench-ci"
            echo "BENCH_ROOT=$GITHUB_WORKSPACE/.cli-bench/ci"
            echo "BENCH_CLI=$GITHUB_WORKSPACE/target/release/cli-bench"
          } >> "$GITHUB_ENV"
          mkdir -p .cli-bench/ci/logs
      - name: Install one dated Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -Vv > "$BENCH_ROOT/logs/rustc-version.txt"
          cargo -Vv > "$BENCH_ROOT/logs/cargo-version.txt"
      - name: Install exact measurement engine
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: hyperfine@1.20.0
          fallback: none
      - name: Install and identify GNU references and native RSS tool
        id: tools
        run: bash "$BENCH_CI/setup-native.sh"
      - name: Build harness before benchmark roles
        id: harness
        run: cargo build --locked --release -p cli-bench
      - name: Build selected roles serially before any timing
        id: roles
        run: bash "$BENCH_CI/native.sh" build
      - name: Measure prepared selected suites serially
        if: ${{ !cancelled() && steps.harness.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: bash "$BENCH_CI/native.sh" run
      - name: Project small typed output even after failure
        id: summary
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          uv run --frozen --offline --project "$BENCH_CI" python "$BENCH_CI/summary.py" \
            --root "$BENCH_ROOT" --cli "$BENCH_CLI" --profile "$MEASUREMENT_PROFILE" --platform "$PLATFORM"

  smoke_macos:
    name: Smoke measurement (macos)
    needs: [select, tests]
    if: ${{ needs.select.outputs.has_packages == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
