  full_macos:
    name: Full measurement (macos)
    needs: [select, tests, smoke_linux, smoke_macos]
    if: ${{ needs.select.outputs.has_packages == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PLATFORM: macos
      MEASUREMENT_PROFILE: full
      BENCH_PACKAGES: ${{ needs.select.outputs.packages }}
      CANDIDATE_SHA: ${{ needs.select.outputs.candidate_sha }}
      PREVIOUS_SHA: ${{ needs.select.outputs.previous_sha }}
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Check out exact selected candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python runtime manager
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          python-version: '3.14'
          enable-cache: false
          github-token: ''
      - name: Install managed Python and copy CI adapters
        id: python
        run: |
          uv python install 3.14
          cp -R tools/cli-bench/ci "$RUNNER_TEMP/cli-bench-ci"
          uv sync --frozen --project "$RUNNER_TEMP/cli-bench-ci"
          {
            echo "BENCH_CI=$RUNNER_TEMP/cli-bench-ci"
            echo "BENCH_ROOT=$GITHUB_WORKSPACE/.cli-bench/ci"
            echo "BENCH_CLI=$GITHUB_WORKSPACE/target/release/cli-bench"
          } >> "$GITHUB_ENV"
          mkdir -p .cli-bench/ci/logs
      - name: Install one dated Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -Vv > "$BENCH_ROOT/logs/rustc-version.txt"
          cargo -Vv > "$BENCH_ROOT/logs/cargo-version.txt"
      - name: Install exact measurement engine
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: hyperfine@1.20.0
          fallback: none
      - name: Install and identify GNU references and native RSS tool
        id: tools
        run: bash "$BENCH_CI/setup-native.sh"
      - name: Build harness before benchmark roles
        id: harness
        run: cargo build --locked --release -p cli-bench
      - name: Build selected roles serially before any timing
        id: roles
        run: bash "$BENCH_CI/native.sh" build
      - name: Measure prepared selected suites serially
        if: ${{ !cancelled() && steps.harness.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: bash "$BENCH_CI/native.sh" run
      - name: Project small typed output even after failure
        id: summary
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          uv run --frozen --offline --project "$BENCH_CI" python "$BENCH_CI/summary.py" \
            --root "$BENCH_ROOT" --cli "$BENCH_CLI" --profile "$MEASUREMENT_PROFILE" --platform "$PLATFORM"

  comment:
    name: Update same-repository PR benchmark comment
    needs: [select, tests, smoke_linux, smoke_macos, full_linux, full_macos]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && startsWith(github.workflow_ref, format('{0}/.github/workflows/cli-bench.yml@', github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Read authoritative run identity and stale-run ordering.
      pull-requests: write # Update only this workflow's bot-owned PR comment.
    steps:
      - name: Validate bounded outputs and update one marked comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BENCH_PACKAGES: ${{ needs.select.outputs.packages }}
          SELECTION_RESULT: ${{ needs.select.result }}
          CANDIDATE_SHA: ${{ needs.select.outputs.candidate_sha }}
          PREVIOUS_SHA: ${{ needs.select.outputs.previous_sha }}
          LINUX_SMOKE: ${{ needs.smoke_linux.outputs.summary }}
          LINUX_SMOKE_RESULT: ${{ needs.smoke_linux.result }}
          MACOS_SMOKE: ${{ needs.smoke_macos.outputs.summary }}
          MACOS_SMOKE_RESULT: ${{ needs.smoke_macos.result }}
          LINUX_FULL: ${{ needs.full_linux.outputs.summary }}
          LINUX_FULL_RESULT: ${{ needs.full_linux.result }}
          MACOS_FULL: ${{ needs.full_macos.outputs.summary }}
          MACOS_FULL_RESULT: ${{ needs.full_macos.result }}
        with:
          retries: 0
          debug: false
          script: |
            // BEGIN COMMENT SCRIPT
            const marker = '<!-- cli-bench:v1 -->';
            const packagesAllowed = ['biggie', 'tailr', 'mkdirr'];
            const rolesAllowed = ['candidate', 'previous', 'reference'];
            const fail = () => { throw new Error('Invalid benchmark comment input'); };
            const exact = (value, keys) => {
              if (!value || Array.isArray(value) || typeof value !== 'object' || Object.keys(value).sort().join() !== keys.slice().sort().join()) fail();
            };
            const list = (value, max) => { if (!Array.isArray(value) || value.length > max) fail(); };
            const text = value => { if (typeof value !== 'string' || [...value].length > 128 || Buffer.byteLength(value) > 512) fail(); };
            const metric = (value, negative=false) => { if (value !== null && (typeof value !== 'number' || !Number.isFinite(value) || Math.abs(value) > 1e15 || (!negative && value < 0))) fail(); };
            const integer = value => { if (!Number.isSafeInteger(value) || value < 1) fail(); return value; };
            const unique = values => { if (new Set(values).size !== values.length) fail(); };
            // Encode punctuation as entities too: labels cannot create links, tables,
            // HTML, mentions, hidden comments or additional Markdown structure.
            const escape = value => [...String(value)].map(ch => /[a-zA-Z0-9 /:.,%-]/.test(ch) ? ch : `&#${ch.codePointAt(0)};`).join('');
            function decode(raw, platform, profile, selected) {
              if (typeof raw !== 'string' || Buffer.byteLength(raw) > 24000) fail();
              const value = JSON.parse(raw);
              exact(value, ['version','platform','profile','suites']);
              if (value.version !== 1 || value.platform !== platform || value.profile !== profile) fail();
              list(value.suites, 3);
              if (value.suites.map(suite => suite.package).sort().join() !== selected.slice().sort().join()) fail();
              for (const suite of value.suites) {
                exact(suite, ['package','outcome','failure','cases','omitted_cases','issues']);
                if (!packagesAllowed.includes(suite.package) || !['complete','failed','incomplete','unavailable'].includes(suite.outcome)) fail();
                if (suite.failure !== null) text(suite.failure);
                if (!Number.isInteger(suite.omitted_cases) || suite.omitted_cases < 0 || suite.omitted_cases > 128) fail();
                list(suite.issues,4); suite.issues.forEach(text);
                list(suite.cases,12); unique(suite.cases.map(item => item.id));
                if (suite.cases.length + suite.omitted_cases > 128) fail();
                for (const item of suite.cases) {
                  exact(item,['id','roles','comparisons']); text(item.id);
                  list(item.roles,3); unique(item.roles.map(role => role.role));
                  for (const role of item.roles) {
                    exact(role,['role','elapsed_mean','rss_mean','executable_bytes']);
                    if (!rolesAllowed.includes(role.role)) fail();
                    metric(role.elapsed_mean); metric(role.rss_mean); metric(role.executable_bytes);
                    if (!Number.isSafeInteger(role.executable_bytes)) fail();
                  }
                  list(item.comparisons,2); unique(item.comparisons.map(comparison => comparison.baseline));
                  for (const comparison of item.comparisons) {
                    exact(comparison,['baseline','candidate','ratio','elapsed_change_percent','direction']);
                    if (!['previous','reference'].includes(comparison.baseline) || comparison.candidate !== 'candidate') fail();
                    metric(comparison.ratio); metric(comparison.elapsed_change_percent,true);
                    if (!['faster','slower','equal','inconclusive','smoke-only','unavailable'].includes(comparison.direction)) fail();
                    if (profile === 'smoke' && !['smoke-only','unavailable'].includes(comparison.direction)) fail();
                    if (suite.outcome !== 'complete' && (comparison.ratio !== null || comparison.elapsed_change_percent !== null || comparison.direction !== 'unavailable')) fail();
                  }
                }
              }
              return value;
            }
            try {
              const env = process.env;
