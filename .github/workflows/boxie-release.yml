name: 🚀 Boxie runtime release
'on':
  push:
    branches:
    - master
    paths:
    - tools/boxie/src/**
    - tools/boxie/alembic/**
    - tools/boxie/pyproject.toml
    - tools/boxie/infra/Runtime.Dockerfile
    - tools/boxie/infra/compose.production.yml
    - tools/boxie/infra/compose.operations.yml
    - tools/boxie/infra/deploy.sh
    - .github/workflows/boxie-release.yml
    - pyproject.toml
    - uv.lock
    - .python-version
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: boxie-release
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish Boxie runtime
    if: ${{ github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true' && vars.BOXIE_BACKUP_RESTORE_VERIFIED
      == 'true' && (github.event_name != 'push' || vars.BOXIE_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ github.sha }}
      changed: ${{ steps.select.outputs.runtime }}
      sandbox_changed: ${{ steps.select.outputs.sandbox }}
      runtime_image: ${{ steps.runtime.outputs.digest && format('{0}@{1}', steps.images.outputs.runtime, steps.runtime.outputs.digest)
        || '' }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
    - name: 📥 Check out reviewed release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: 'false'
        fetch-depth: 0
    - name: Select affected runtime images
      id: select
      env:
        APP: boxie
      run: python3 tools/boxie/infra/boxie_infra/release_selection.py "$APP" "" >> "$GITHUB_OUTPUT"
    - name: 🏷️ Choose image names and unique release tag
      id: images
      env:
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: printf 'runtime=ghcr.io/%s-boxie\ntag=run-%s-%s\n' "${REPOSITORY,,}" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        cache-binary: 'false'
    - name: 🔐 Sign in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build and publish Boxie runtime
      id: runtime
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: tools/boxie/infra/Runtime.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: ${{ steps.images.outputs.runtime }}:${{ steps.images.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
      if: ${{ steps.select.outputs.runtime == 'true' }}
  deploy:
    name: Deploy boxie
    needs: release
    if: ${{ github.ref == 'refs/heads/master' && (needs.release.outputs.changed == 'true' || needs.release.outputs.sandbox_changed
      == 'true') }}
    environment: boxie
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: clis-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
    - name: Check out reviewed deployment source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Copy release and run bounded host operation
      env:
        RUNTIME_IMAGE: ${{ needs.release.outputs.runtime_image }}
        DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        GHCR_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        run="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        [[ $run =~ ^[0-9]+-[0-9]+$ && $GITHUB_SHA =~ ^[a-f0-9]{40}$ ]]
        [[ $DEPLOY_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
        private=$(mktemp -d)
        trap 'rm -rf "$private"' EXIT
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$private/key"
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$private/known_hosts"
        cat > "$private/config" <<EOF
        Host deployment
          HostName $DEPLOY_HOST
          User root
          IdentityFile $private/key
          IdentitiesOnly yes
          UserKnownHostsFile $private/known_hosts
          StrictHostKeyChecking yes
          BatchMode yes
          ConnectTimeout 15
          ServerAliveInterval 15
          ServerAliveCountMax 3
        EOF
        current=$(ssh -F "$private/config" deployment 'cat /srv/clis/deployment/boxie/current/revision')
        [[ $current =~ ^[a-f0-9]{40}$ ]]
        git merge-base --is-ancestor "$current" "$GITHUB_SHA" || { echo 'Refusing to replace a newer or unrelated release.' >&2; exit 1; }
        selection=$(python3 tools/boxie/infra/boxie_infra/release_selection.py boxie "$current")
        if [[ $selection != *runtime=true* && $selection != *sandbox=true* ]]; then
            echo 'No runtime changes since the successful deployment.'
            exit 0
        fi
        mkdir -p "$private/payload/tools/boxie"
        cp -a tools/boxie/infra "$private/payload/tools/boxie/infra"
        printf '%s\n' "$GITHUB_SHA" > "$private/payload/revision"
        printf '%s\n' "$current" > "$private/payload/expected-revision"
        [[ $RUNTIME_IMAGE =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
        printf 'BOXIE_RUNTIME_IMAGE=%s\n' "$RUNTIME_IMAGE" > "$private/payload/image.env"
        # The token is restricted to package reads and never appears in the remote command.
        mkdir "$private/payload/registry"
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$private/payload/registry/config.json"
        ssh -F "$private/config" deployment "test ! -e /opt/clis/releases/boxie/$run && install -d -m 0700 /opt/clis/staging/boxie/$run /opt/clis/releases/boxie"
        scp -F "$private/config" -r "$private/payload" "deployment:/opt/clis/staging/boxie/$run/"
        ssh -F "$private/config" deployment "mv /opt/clis/staging/boxie/$run/payload /opt/clis/releases/boxie/$run"
        unit="clis-boxie@$run.service"
        echo "Operation: $unit" >> "$GITHUB_STEP_SUMMARY"
        ssh -F "$private/config" deployment "systemctl start $unit" || { echo "Operation outcome requires inspection: systemctl show $unit; journalctl -u $unit" >&2; exit 1; }
        ssh -F "$private/config" deployment "test \"\$(systemctl show $unit -p Result --value)\" = success && test \"\$(systemctl show $unit -p SubState --value)\" = exited && test \"\$(systemctl show $unit -p ExecMainStatus --value)\" = 0 && test \"\$(cat /srv/clis/deployment/boxie/current/revision)\" = $GITHUB_SHA && test ! -e /srv/clis/deployment/pending"
