name: 🚀 Boxie runtime release
'on':
  push:
    branches: [master]
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: clis-production
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: 📥 Select current master
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      attempt: ${{ steps.revision.outputs.attempt }}
      changed: ${{ steps.selection.outputs.changed }}
    steps:
      - name: 📥 Check out current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0
      - name: 🔎 Record the source commit
        id: revision
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
          enable-cache: false
      - name: 🔎 Select affected runtime component
        id: selection
        env:
          BASE_SHA: ${{ github.event.before }}
          SELECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          changed=true
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            package=$(uv workspace dir --package boxie)
            changes=$(git diff --name-only --no-renames "$BASE_SHA..$SELECTED_SHA" -- \
              Cargo.toml Cargo.lock rust-toolchain.toml pyproject.toml uv.lock .python-version .dockerignore .github/workflows \
              "$package/src" "$package/alembic" \
              "$package/pyproject.toml" "$package/infra/Runtime.Dockerfile*" \
              "$package/infra/compose.production.yml" "$package/infra/compose.operations.yml" \
              "$package/infra/compose.observability.yml" "$package/infra/deploy.sh" \
              "$package/infra/boxie_infra/smoke.py" "$package/infra/boxie_infra/terminal.py")
            [[ -n "$changes" ]] || changed=false
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    uses: ./.github/workflows/build-runtime-image.yml # zizmor: ignore[self-repository]
    with:
      component: boxie
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
    if: ${{ needs.source.outputs.changed == 'true' }}
  deploy:
    name: 🚀 Update Boxie with Compose
    needs: [source, build]
    if: ${{ github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true' && vars.BOXIE_BACKUP_RESTORE_VERIFIED == 'true' && (github.event_name != 'push' || vars.BOXIE_AUTO_DEPLOY == 'true') }}
    environment: boxie
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔎 Require a complete workflow retry
        env:
          SOURCE_ATTEMPT: ${{ needs.source.outputs.attempt }}
        run: |
          if [[ -z $SOURCE_ATTEMPT || $SOURCE_ATTEMPT != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'Use Re-run all jobs or start a new workflow run to select current master.' >&2
            exit 1
          fi
      - name: 📥 Check out the built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
          enable-cache: false
      - name: 🚀 Copy Boxie files and run Compose
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
          RUNTIME_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          boxie=$(uv workspace dir --package boxie)
          umask 077
          [[ $SOURCE_SHA =~ ^[a-f0-9]{40}$ && $BUILT_SHA == "$SOURCE_SHA" ]]
          [[ $(git rev-parse HEAD) == "$SOURCE_SHA" ]]
          [[ $RUNTIME_IMAGE =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          [[ $DEPLOY_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          [[ $GITHUB_RUN_ID =~ ^[0-9]+$ && $GITHUB_RUN_ATTEMPT =~ ^[0-9]+$ ]]
          private=$(mktemp -d)
          trap 'rm -rf "$private"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$private/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$private/known_hosts"
          cat > "$private/config" <<SSH
          Host deployment
            HostName $DEPLOY_HOST
            User root
            IdentityFile $private/key
            IdentitiesOnly yes
            UserKnownHostsFile $private/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          SSH
          remote="/run/clis-boxie-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$private/config" deployment "install -d -m 0700 /opt/clis/boxie $remote"
          scp -F "$private/config" -r "${boxie}/infra/." deployment:/opt/clis/boxie/
          collector=$(ssh -F "$private/config" deployment "sed -n 's/^OBS_COLLECTOR_IMAGE=//p' /etc/clis/boxie-image.env")
          [[ $collector =~ ^[a-z0-9][a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          printf 'BOXIE_RUNTIME_IMAGE=%s\nOBS_COLLECTOR_IMAGE=%s\n' "$RUNTIME_IMAGE" "$collector" > "$private/image.env"
          mkdir "$private/registry"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$private/registry/config.json"
          scp -F "$private/config" "$private/image.env" deployment:"$remote/image.env"
          scp -F "$private/config" -r "$private/registry" deployment:"$remote/registry"
          ssh -F "$private/config" deployment "set -e; trap 'rm -rf $remote' EXIT; install -m 0600 $remote/image.env /etc/clis/boxie-image.env; DOCKER_CONFIG=$remote/registry bash /opt/clis/boxie/deploy.sh $SOURCE_SHA"
