name: 🌐 Playground PR previews

# Only the default-branch script runs with credentials. PR artifacts remain opaque data.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [🏗️ Playground PR binary builds]
    types: [in_progress, completed]
  pull_request_target:
    branches: [master]
    types: [closed, reopened]

permissions: {}

jobs:
  publish:
    environment: playground-preview
    name: 🌐 Publish playground previews and PR links
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.display_title != '⏭️ CI skipped' }}
    concurrency:
      group: cli-playground-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
      deployments: write
    steps:
      - name: 📥 Check out trusted preview controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: 🌐 Publish playground previews and PR links
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}
          PLAYGROUND_DEPLOY_TOKEN: ${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}
        run: uv run --locked --no-dev python tools/cli-playground/preview_ci.py publish --repo "$REPOSITORY" --run-id "$RUN_ID"
  lifecycle:
    environment: playground-preview
    name: 🧹 Reconcile playground preview lifecycle
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.base.ref == 'master' && (github.event.action == 'closed' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) }}
    concurrency:
      group: cli-playground-lifecycle-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      deployments: write
    steps:
      - name: 📥 Check out trusted preview controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: 🧹 Reconcile closed and reopened PR previews
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}
          PLAYGROUND_DEPLOY_TOKEN: ${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}
        run: |
          uv run --locked --no-dev python tools/cli-playground/preview_ci.py lifecycle \
            --repo "$REPOSITORY" --pr "$PR_NUMBER" --action "$PR_ACTION"
