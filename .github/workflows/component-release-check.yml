name: 🐳 Component release smoke

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'tools/deploy/**'
      - 'tools/boxie/infra/**'
      - 'tools/cli-playground/infra/**'
      - 'infra/host/**'
      - 'infra/environments/**'
      - '.github/workflows/*release*.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: 🐳 Verify independent component releases
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: 📦 Install locked workspace dependencies
        run: uv sync --locked --all-packages
      - name: 🔧 Independent updates, failed activation, rollback and retained state
        run: uv run --locked pytest tools/deploy/tests/test_native_release.py -m integration -v
