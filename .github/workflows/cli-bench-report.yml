name: 📊 CLI benchmark reporting

# Trusted default-branch checkout only; bounded artifacts are data, never executed or extracted.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [⏱️ CLI benchmark execution]
    types: [completed]

permissions: {}

concurrency:
  group: cli-bench-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: 📊 Publish CLI benchmark results
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title != '⏭️ CI skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # workflow_run checks out the trusted default-branch SHA, never the PR head.
      - name: 📥 Check out trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: 📊 Publish benchmark results and runner timings
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: uv run --locked --no-dev --package cli-bench --extra ci python tools/cli-bench/report.py --repo "$REPOSITORY" --run-id "$RUN_ID" --post
