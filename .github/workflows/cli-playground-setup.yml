name: ☁️ Playground infrastructure setup

on:
  workflow_dispatch:

permissions: {}

jobs:
  provision:
    name: ☁️ Provision playground infrastructure
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: playground
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: cli-playground-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: 'true'
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      # The S3 client expects AWS names; these credentials belong to Cloudflare R2.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}
    steps:
      - name: 📥 Check out reviewed infrastructure source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: 📦 Install locked Python workspace dependencies
        run: uv sync --locked --all-packages
      - name: ☁️ Set up Pulumi infrastructure tooling
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2
        with:
          pulumi-version: '3.268.0'
      - name: 🔎 Validate production infrastructure configuration
        run: uv run --locked python -m playground_infra.ci configure
      - name: ☁️ Provision Hetzner host and Cloudflare DNS
        working-directory: tools/cli-playground/infra
        run: |
          pulumi login "$PULUMI_BACKEND_URL" --non-interactive
          pulumi stack select production --create --secrets-provider passphrase --non-interactive
          pulumi preview --refresh --non-interactive --diff
          pulumi up --yes --refresh --non-interactive --suppress-outputs
