name: YAML lint
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
permissions:
  contents: read
concurrency:
  group: yaml-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONPATH: tools
jobs:
  select:
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.paths.outputs.selected }}
      base: ${{ steps.paths.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/guardrails/tests -p test_scope.py
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -m guardrails.scope --base "$BASE"
          --patterns '*.yml' '*.yaml'
          --present '*.yml' '*.yaml'
          --config '.yamllint.yml' '.github/workflows/yaml-lint.yml' 'tools/guardrails/yaml_lint.py' 'tools/guardrails/changes.py' 'tools/guardrails/scope.py'
  check:
    name: YAML lint
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: ${{ needs.select.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
      - run: uv tool install yamllint==1.38.0
      - run: python3 -m guardrails.yaml_lint --base "$BASE"
