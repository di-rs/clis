name: Fuzz

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [parsu_xml, tail_bytes]
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '15' || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rust-src
      - name: Install verified cargo-fuzz 0.13.2
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/cargo-fuzz.tar.gz"
          echo "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c  $RUNNER_TEMP/cargo-fuzz.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-fuzz.tar.gz" -C "$RUNNER_TEMP" cargo-fuzz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Record environment and fetch locked dependencies
        run: |
          mkdir -p "tools/fuzz/runs/$FUZZ_TARGET/corpus"
          rustc -Vv > "tools/fuzz/runs/$FUZZ_TARGET/environment.txt"
          git rev-parse HEAD >> "tools/fuzz/runs/$FUZZ_TARGET/environment.txt"
          cargo fuzz --version >> "tools/fuzz/runs/$FUZZ_TARGET/environment.txt"
          cargo fetch --locked --manifest-path tools/fuzz/Cargo.toml
          cp -R "tools/fuzz/corpus/$FUZZ_TARGET/." "tools/fuzz/runs/$FUZZ_TARGET/corpus/"
      - name: Build the native fuzz target
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo fuzz build --fuzz-dir tools/fuzz "$FUZZ_TARGET" --target x86_64-unknown-linux-gnu 2>&1 | tee "tools/fuzz/runs/$FUZZ_TARGET/build.log"
          git diff --exit-code -- Cargo.lock tools/fuzz/Cargo.lock
      - name: Replay reviewed seeds
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo fuzz run --fuzz-dir tools/fuzz "$FUZZ_TARGET" "tools/fuzz/corpus/$FUZZ_TARGET" --target x86_64-unknown-linux-gnu -- -runs=0 -max_len=4096 -timeout=5 -rss_limit_mb=1024 2>&1 | tee "tools/fuzz/runs/$FUZZ_TARGET/replay.log"
          git diff --exit-code -- Cargo.lock tools/fuzz/Cargo.lock
      - name: Bounded fuzz run
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo fuzz run --fuzz-dir tools/fuzz "$FUZZ_TARGET" "tools/fuzz/runs/$FUZZ_TARGET/corpus" --target x86_64-unknown-linux-gnu -- -max_total_time="$FUZZ_SECONDS" -max_len=4096 -timeout=5 -rss_limit_mb=1024 2>&1 | tee "tools/fuzz/runs/$FUZZ_TARGET/run.log"
          git diff --exit-code -- Cargo.lock tools/fuzz/Cargo.lock
      - name: Preserve failures and corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            tools/fuzz/artifacts/${{ matrix.target }}/
            tools/fuzz/runs/${{ matrix.target }}/
          retention-days: 14
          if-no-files-found: error
