version: 2
updates:
  - package-ecosystem: cargo
    directories: [/, /tests/consumers]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      rust-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
