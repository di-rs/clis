# The domain-clippy hook selects this config for biggie/tailr libraries only.
disallowed-methods = [
  { path = "std::io::stdin", reason = "Accept caller-owned input in domain APIs." },
  { path = "std::io::stdout", reason = "Accept caller-owned output in domain APIs." },
  { path = "std::io::stderr", reason = "Return typed errors; diagnostics belong to the adapter." },
  { path = "std::env::args", reason = "Arguments belong to the CLI adapter." },
  { path = "std::env::args_os", reason = "Arguments belong to the CLI adapter." },
  { path = "std::env::var", reason = "Pass configuration explicitly." },
  { path = "std::env::var_os", reason = "Pass configuration explicitly." },
  { path = "std::env::vars", reason = "Pass configuration explicitly." },
  { path = "std::env::vars_os", reason = "Pass configuration explicitly." },
  { path = "std::env::current_dir", reason = "Pass filesystem context explicitly." },
  { path = "std::env::set_current_dir", reason = "Do not mutate process state in domain operations." },
  { path = "std::env::set_var", reason = "Do not mutate process state in domain operations." },
  { path = "std::env::remove_var", reason = "Do not mutate process state in domain operations." },
  { path = "std::process::exit", reason = "Return outcomes to the caller." },
  { path = "std::process::abort", reason = "Return outcomes to the caller." },
  { path = "tracing::subscriber::set_global_default", reason = "The application owns diagnostics initialization." },
  { path = "log::set_logger", reason = "The application owns diagnostics initialization." },
  { path = "cli_tracing::run", reason = "This is a CLI entry adapter, not a domain operation." },
]
