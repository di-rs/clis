# Approved v1 recipes; full base settings and explicit smoke overrides.
# See docs/superpowers/specs/2026-10-06-cli-bench-experiments.md.
schema_version = 1
id = "biggie"
allow_reference = false
package = "biggie"
binary = "biggie"
datasets = []

[generator]
revision = "0d8caa8387d446e91ef263c1ecab88870b735eb5"
package = "biggie"
binary = "biggie"

[environment]
LC_ALL = "C"
TZ = "UTC"
CLIS_LOG_LEVEL = "off"

[[cases]]
id = "text"
purpose = "Generate independently checked text to a drained stdout pipe"
argv = ["--lines", "100000", "--words-per-line", "4", "--word-length", "8", "--seed", "42", "-"]
expected_status = 0
correctness = [{ kind = "comparator", target = "previous", stream = "stdout" }, { kind = "text-shape", records = 100000, words_per_record = 4, word_length = 8 }, { kind = "empty-stderr" }]
work = { amount = 3600000, unit = "bytes" }

[cases.io.stdin]
kind = "null"

[cases.io.stdout]
kind = "drained-pipe"

[cases.profiles.smoke]
argv = ["--lines", "1000", "--words-per-line", "4", "--word-length", "8", "--seed", "42", "-"]
correctness = [{ kind = "comparator", target = "previous", stream = "stdout" }, { kind = "text-shape", records = 1000, words_per_record = 4, word_length = 8 }, { kind = "empty-stderr" }]
