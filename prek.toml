# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    # CI checks committed files, so the staging-only default would miss additions.
    # This existing benchmark dataset is intentionally larger than 500 KiB.
    {
      id = "check-added-large-files",
      args = ["--enforce-all"],
      exclude = '^coreutils/tailr/benches/data/1M\.txt$',
    },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "cargo fmt --",
    types = ["rust"],
    pass_filenames = false,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
    files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)(rust-toolchain|clippy|prek)\.toml$|(^|/)tests/|^\.config/nextest\.toml$)',
    pass_filenames = false,
  },
  {
    id = "cargo-nexttest",
    name = "cargo nextest",
    language = "system",
    entry = "cargo nextest run --locked --workspace --hide-progress-bar --failure-output final",
    files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)(rust-toolchain|clippy|prek)\.toml$|(^|/)tests/|^\.config/nextest\.toml$)',
    pass_filenames = false,
  },
  {
    id = "workspace-policy",
    name = "workspace metadata policy",
    language = "system",
    entry = "python3 scripts/check_workspace.py",
    files = '((^|/)Cargo\.toml$|^scripts/check_workspace\.py$)',
    pass_filenames = false,
  },
  {
    id = "policy-tests",
    name = "policy script tests",
    language = "system",
    entry = "python3 -m unittest discover -s scripts/tests",
    files = '^scripts/.*\.py$',
    pass_filenames = false,
  },
  {
    id = "domain-clippy",
    name = "domain library boundaries",
    language = "system",
    entry = "bash scripts/check-domain.sh",
    files = '(^biggie/|^coreutils/tailr/|^scripts/check-domain\.sh$|^\.config/domain-clippy/|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$)',
    pass_filenames = false,
  },
]
