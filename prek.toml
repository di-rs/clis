# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    # CI checks committed files, so the staging-only default would miss additions.
    # This existing benchmark dataset is intentionally larger than 500 KiB.
    {
      id = "check-added-large-files",
      args = ["--enforce-all"],
      exclude = '^coreutils/tailr/benches/data/1M\.txt$',
    },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "cargo fmt --",
    types = ["rust"],
    pass_filenames = false,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe_code",
    files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)(rust-toolchain|clippy|prek)\.toml$|(^|/)tests/|^\.config/nextest\.toml$)',
    pass_filenames = false,
  },
  {
    id = "cargo-nexttest",
    name = "cargo nextest",
    language = "system",
    entry = "cargo nextest run --locked --workspace --hide-progress-bar --failure-output final",
    files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)(rust-toolchain|clippy|prek)\.toml$|(^|/)tests/|^\.config/nextest\.toml$)',
    pass_filenames = false,
  },
  {
    id = "zizmor",
    name = "zizmor workflow security",
    language = "system",
    entry = "zizmor --offline --no-progress .github/workflows",
    files = '(^\.github/.*\.ya?ml$|^zizmor\.ya?ml$|^prek\.toml$)',
    pass_filenames = false,
  },
  {
    id = "domain-clippy",
    name = "domain library boundaries",
    language = "system",
    entry = "env CLIPPY_CONF_DIR=.config/domain-clippy cargo clippy --locked --no-deps -p biggie -p tailr --lib -- -D warnings -D clippy::disallowed_methods -F unsafe_code",
    files = '(^biggie/|^coreutils/tailr/|^\.config/domain-clippy/|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$)',
    pass_filenames = false,
  },
]
