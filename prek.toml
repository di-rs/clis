# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]
minimum_prek_version = "0.5.5"

[[repos]]
repo = "builtin"
hooks = [
    {
      id = "require-pattern",
      name = "Gitmoji commit subject",
      # Official emoji and shortcode catalogue: https://gitmoji.dev/
      args = ["--multiline", '\A(:twisted_rightwards_arrows:|:chart_with_upwards_trend:|:triangular_flag_on_post:|:building_construction:|:closed_lock_with_key:|:globe_with_meridians:|:busts_in_silhouette:|:construction_worker:|:children_crossing:|:adhesive_bandage:|:heavy_minus_sign:|:money_with_wings:|:passport_control:|:white_check_mark:|:heavy_plus_sign:|:page_facing_up:|:rotating_light:|:speech_balloon:|:card_file_box:|:camera_flash:|:construction:|:monocle_face:|:technologist:|:green_heart:|:safety_vest:|:see_no_evil:|:stethoscope:|:wastebasket:|:arrow_down:|:clown_face:|:loud_sound:|:wheelchair:|:ambulance:|:test_tube:|:airplane:|:arrow_up:|:bookmark:|:goal_net:|:lipstick:|:seedling:|:sparkles:|:alembic:|:necktie:|:package:|:pencil2:|:pushpin:|:recycle:|:bricks:|:coffin:|:hammer:|:iphone:|:rewind:|:rocket:|:thread:|:wrench:|:alien:|:beers:|:bento:|:dizzy:|:label:|:t\-rex:|:truck:|:boom:|:bulb:|:fire:|:lock:|:memo:|:mute:|:poop:|:tada:|:art:|:bug:|:egg:|:mag:|:zap:|🧑‍💻|⏪️|♻️|♿️|⚗️|⚡️|⚰️|✈️|✏️|⬆️|⬇️|🏗️|🏷️|👽️|📦️|🔍️|🔒️|🗃️|🗑️|🚑️|⏪|♻|♿|⚗|⚡|⚰|✅|✈|✏|✨|➕|➖|⬆|⬇|🌐|🌱|🍱|🍻|🎉|🎨|🏗|🏷|🐛|👔|👥|👷|👽|💄|💚|💡|💥|💩|💫|💬|💸|📄|📈|📌|📝|📦|📱|📸|🔀|🔇|🔊|🔍|🔐|🔒|🔖|🔥|🔧|🔨|🗃|🗑|🙈|🚀|🚑|🚚|🚧|🚨|🚩|🚸|🛂|🤡|🥅|🥚|🦖|🦺|🧐|🧪|🧱|🧵|🩹|🩺) [^\s]'],
      stages = ["commit-msg"],
      always_run = true,
    },
    {
      id = "check-added-large-files",
      args = ["--enforce-all"],
    },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "python3 tools/check_changed.py cargo-fmt",
    files = '\.rs$|(^|/)Cargo\.(toml|lock)$|^(buildins/|utils/|packages/(biggie|kara|parsu)/|\.cargo/|\.config/|Cargo\.(toml|lock)$|\.?rustfmt\.toml$|\.?clippy\.toml$|rust-toolchain\.toml$|prek\.toml$|tools/check_changed\.py$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "python3 tools/check_changed.py cargo-clippy",
    files = '\.rs$|(^|/)Cargo\.(toml|lock)$|^(buildins/|utils/|packages/(biggie|kara|parsu)/|\.cargo/|\.config/|Cargo\.(toml|lock)$|\.?rustfmt\.toml$|\.?clippy\.toml$|rust-toolchain\.toml$|prek\.toml$|tools/check_changed\.py$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "cargo-nexttest",
    name = "cargo nextest",
    language = "system",
    entry = "python3 tools/check_changed.py cargo-nexttest",
    files = '\.rs$|(^|/)Cargo\.(toml|lock)$|^(buildins/|utils/|packages/(biggie|kara|parsu)/|\.cargo/|\.config/|Cargo\.(toml|lock)$|\.?rustfmt\.toml$|\.?clippy\.toml$|rust-toolchain\.toml$|prek\.toml$|tools/check_changed\.py$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "cli-check",
    name = "CLI repository standards",
    language = "system",
    entry = "uv run --locked cli-check",
    files = '\.rs$|(^|/)(Cargo\.toml|README\.md|mk-outs\.nu|mk-outputs\.nu)$|(^|/)(tests|benches)/|^tools/cli-check/|^(pyproject\.toml|uv\.lock|prek\.toml)$',
    pass_filenames = false,
    include_deleted = true,
  },
  {
    id = "ruff",
    name = "Python lint",
    language = "system",
    entry = "python3 tools/check_changed.py ruff",
    files = '^tools/check_changed\.py$|((^|/)\.?ruff\.toml$|\.pyi?$|(^|/)pyproject\.toml$|^(uv\.lock|\.python-version|prek\.toml)$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "ruff-format",
    name = "Python format check",
    language = "system",
    entry = "python3 tools/check_changed.py ruff-format",
    files = '^tools/check_changed\.py$|((^|/)\.?ruff\.toml$|\.pyi?$|(^|/)pyproject\.toml$|^(uv\.lock|\.python-version|prek\.toml)$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "mypy",
    name = "Python type check",
    language = "system",
    entry = "python3 tools/check_changed.py mypy",
    files = '^(packages/boxie/|tools/cli-playground/|tools/cli-bench/|tools/cli-check/|infra/)|^tools/check_changed\.py$|(\.pyi?$|(^|/)pyproject\.toml$|^(uv\.lock|\.python-version|prek\.toml)$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "python-tests",
    name = "Python regression tests",
    language = "system",
    entry = "python3 tools/check_changed.py python-tests",
    files = '^(packages/boxie/|tools/cli-playground/|tools/cli-bench/|tools/cli-check/|infra/)|^tools/check_changed\.py$|(\.pyi?$|(^|/)pyproject\.toml$|^(uv\.lock|\.python-version|prek\.toml)$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "lychee",
    name = "local Markdown links and anchors",
    language = "system",
    entry = "lychee --offline --include-fragments=anchor-only --",
    types = ["markdown"],
  },
  {
    id = "typos",
    name = "Markdown spelling",
    language = "system",
    entry = "typos --force-exclude --",
    types = ["markdown"],
  },
  {
    id = "actionlint",
    name = "workflow syntax and shell linting",
    language = "system",
    entry = "python3 tools/check_changed.py actionlint",
    files = '^tools/check_changed\.py$|(^\.github/(workflows/[^/]+|actionlint)\.ya?ml$|^prek\.toml$)',
    require_serial = true,
    include_deleted = true,
  },
  {
    id = "zizmor",
    name = "zizmor workflow security",
    language = "system",
    entry = "python3 tools/check_changed.py zizmor",
    files = '^tools/check_changed\.py$|(^\.github/(workflows/[^/]+|.*/action)\.ya?ml$|^zizmor\.ya?ml$|^prek\.toml$)',
    require_serial = true,
    include_deleted = true,
  }
]
