global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s
rule_files:
- rules/boxie.yml
scrape_configs:
- job_name: boxie-api
  static_configs:
  - targets:
    - boxie-api:9101
- job_name: boxie-worker
  static_configs:
  - targets:
    - boxie-worker:9102
- job_name: boxie-agent
  static_configs:
  - targets:
    - boxie-agent:9103
- job_name: playground
  static_configs:
  - targets:
    - playground:9104
- job_name: boxie-api-sdk
  static_configs:
  - targets:
    - boxie-api:9201
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: temporal_(workflow_task_schedule_to_start_latency|activity_schedule_to_start_latency|workflow_task_execution_latency|activity_execution_latency)_seconds_(bucket|sum|count)|temporal_(workflow_completed|workflow_failed|activity_execution_failed)_total
    action: keep
  - source_labels:
    - namespace
    regex: boxie|
    action: keep
  - source_labels:
    - task_queue
    regex: boxie-lifecycle|
    action: keep
  - source_labels:
    - activity_type
    regex: '|load_request|ensure_sandbox|inspect_and_renew|expire_if_current|request_stop|remove_sandbox|record_observation|confirm_removed'
    action: keep
  - source_labels:
    - workflow_type
    regex: '|SandboxLifecycle'
    action: keep
  - regex: __name__|job|instance|le|namespace|task_queue|activity_type|workflow_type
    action: labelkeep
- job_name: boxie-worker-sdk
  static_configs:
  - targets:
    - boxie-worker:9202
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: temporal_(workflow_task_schedule_to_start_latency|activity_schedule_to_start_latency|workflow_task_execution_latency|activity_execution_latency)_seconds_(bucket|sum|count)|temporal_(workflow_completed|workflow_failed|activity_execution_failed)_total
    action: keep
  - source_labels:
    - namespace
    regex: boxie|
    action: keep
  - source_labels:
    - task_queue
    regex: boxie-lifecycle|
    action: keep
  - source_labels:
    - activity_type
    regex: '|load_request|ensure_sandbox|inspect_and_renew|expire_if_current|request_stop|remove_sandbox|record_observation|confirm_removed'
    action: keep
  - source_labels:
    - workflow_type
    regex: '|SandboxLifecycle'
    action: keep
  - regex: __name__|job|instance|le|namespace|task_queue|activity_type|workflow_type
    action: labelkeep
- job_name: temporal
  static_configs:
  - targets:
    - temporal:9090
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: poll_success|poll_success_sync|poll_timeouts|task_dispatch_latency_(bucket|sum|count)|approximate_backlog_count|approximate_backlog_age_seconds|no_poller_tasks
    action: keep
  - source_labels:
    - namespace
    regex: boxie|_tag_excluded_|
    action: keep
  - source_labels:
    - taskqueue
    regex: boxie-lifecycle|_tag_excluded_|
    action: keep
  - source_labels:
    - task_type
    regex: Activity|Workflow
    action: keep
  - source_labels:
    - service_name
    regex: matching
    action: keep
  - source_labels:
    - partition
    regex: 0|1|2|3|__sticky__
    action: keep
  - source_labels:
    - forwarded
    regex: '|true|false'
    action: keep
  - source_labels:
    - task_priority
    regex: '|3'
    action: keep
  - source_labels:
    - __name__
    - worker_version
    separator: ;
    regex: no_poller_tasks;|poll_(success|success_sync|timeouts);__unversioned__|task_dispatch_latency_(bucket|sum|count);__unversioned__|approximate_backlog_(count|age_seconds);__unversioned__
    action: keep
  - source_labels:
    - worker_build_id
    - worker_deployment_name
    - otel_scope_version
    separator: ;
    regex: ;;
    action: keep
  - source_labels:
    - otel_scope_name
    regex: temporal
    action: keep
  - source_labels:
    - __name__
    - operation
    - namespace_state
    - source
    separator: ;
    regex: poll_(success|success_sync|timeouts);TaskQueueMgr;active;|task_dispatch_latency_(bucket|sum|count);MatchingEngine;;History|approximate_backlog_(count|age_seconds);TaskQueuePartitionManager;active;|no_poller_tasks;TaskQueuePartitionManager;active;
    action: keep
  - regex: __name__|job|instance|le|namespace|taskqueue|task_type|service_name|partition|forwarded|task_priority
    action: labelkeep
- job_name: vector
  static_configs:
  - targets:
    - vector:9598
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: vector_(build_info|buffer_size_bytes|buffer_size_events|buffer_max_size_bytes|buffer_received_bytes_total|buffer_received_events_total|buffer_sent_bytes_total|buffer_sent_events_total|buffer_discarded_events_total|buffer_discarded_bytes_total)
    action: keep
  - source_labels:
    - __name__
    - component_id
    - buffer_id
    - buffer_type
    - stage
    - component_kind
    - component_type
    separator: ;
    regex: vector_build_info;.*|vector_buffer_.*;storage;storage;disk;(0|1);sink;http
    action: keep
  - source_labels:
    - intentional
    regex: '|true|false'
    action: keep
  - regex: __name__|job|instance|component_id|buffer_id|buffer_type|stage|intentional|version|arch
    action: labelkeep
- job_name: victorialogs
  static_configs:
  - targets:
    - victorialogs:9428
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: vl_(rows_ingested_total|bytes_ingested_total|rows_dropped_total|http_requests_total|http_errors_total|data_size_bytes|storage_rows|free_disk_space_bytes|total_disk_space_bytes|max_disk_space_usage_bytes|storage_is_read_only)|vm_app_version
    action: keep
  - source_labels:
    - __name__
    - type
    - path
    - reason
    separator: ;
    regex: vl_(rows|bytes)_ingested_total;jsonline;;|vl_rows_dropped_total;;;(debug|too_many_fields|too_big_timestamp|too_small_timestamp)|vl_http_(requests|errors)_total;;/insert/jsonline;|vl_data_size_bytes;(storage|indexdb);;|vl_storage_rows;storage/(inmemory|small|big);;|vl_(free_disk_space_bytes|total_disk_space_bytes|max_disk_space_usage_bytes|storage_is_read_only);;/victoria-logs-data;|vm_app_version;;;
    action: keep
  - regex: __name__|job|instance|type|path|reason|version|short_version
    action: labelkeep
- job_name: node-exporter
  static_configs:
  - targets:
    - node-exporter:9100
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: node_filesystem_(avail_bytes|size_bytes|device_error)|node_memory_Mem(Available|Total)_bytes|node_scrape_collector_success
    action: keep
  - source_labels:
    - mountpoint
    regex: /|
    action: keep
  - source_labels:
    - device_error
    regex: ''
    action: keep
  - source_labels:
    - __name__
    - collector
    separator: ;
    regex: node_scrape_collector_success;(filesystem|meminfo)|node_(filesystem_.*|memory_.*);
    action: keep
  - regex: __name__|job|instance|device|mountpoint|fstype|device_error|collector
    action: labelkeep
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: prometheus_build_info|prometheus_tsdb_head_series|prometheus_tsdb_wal_corruptions_total|prometheus_rule_evaluation_failures_total|prometheus_config_last_reload_successful|process_resident_memory_bytes
    action: keep
  - regex: __name__|job|instance|version|rule_group
    action: labelkeep
