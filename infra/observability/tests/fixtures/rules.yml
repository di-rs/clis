rule_files:
- ../../rules/boxie.yml
evaluation_interval: 15s
tests:
- name: cleanup strict threshold and two minute hold
  interval: 15s
  input_series:
  - series: boxie_snapshot_fresh{job="boxie-api",instance="boxie-api:9101"}
    values: 1x40
  - series: boxie_cleanup_oldest_age_seconds{job="boxie-api",instance="boxie-api:9101"}
    values: 120x3 121x36
  alert_rule_test:
  - eval_time: 2m45s
    alertname: BoxieCleanupDelayed
    exp_alerts: []
  - eval_time: 3m
    alertname: BoxieCleanupDelayed
    exp_alerts:
    - exp_labels:
        job: boxie-api
        instance: boxie-api:9101
        severity: warning
- name: stale snapshot hides cleanup
  interval: 15s
  input_series:
  - series: boxie_snapshot_fresh{job="boxie-api",instance="boxie-api:9101"}
    values: '0x40'
  - series: boxie_cleanup_oldest_age_seconds{job="boxie-api",instance="boxie-api:9101"}
    values: 200x40
  alert_rule_test:
  - eval_time: 5m
    alertname: BoxieCleanupDelayed
    exp_alerts: []
- name: capacity five minute hold
  interval: 15s
  input_series:
  - series: boxie_snapshot_fresh{job="boxie-api",instance="boxie-api:9101"}
    values: 1x40
  - series: boxie_capacity_reserved{job="boxie-api",instance="boxie-api:9101"}
    values: 8x40
  - series: boxie_capacity_limit{job="boxie-api",instance="boxie-api:9101"}
    values: 8x40
  alert_rule_test:
  - eval_time: 4m45s
    alertname: BoxieCapacityFull
    exp_alerts: []
  - eval_time: 5m
    alertname: BoxieCapacityFull
    exp_alerts:
    - exp_labels:
        job: boxie-api
        instance: boxie-api:9101
        severity: warning
- name: zero capacity is unknown
  interval: 15s
  input_series:
  - series: boxie_snapshot_fresh{job="boxie-api",instance="boxie-api:9101"}
    values: 1x40
  - series: boxie_capacity_reserved{job="boxie-api",instance="boxie-api:9101"}
    values: '0x40'
  - series: boxie_capacity_limit{job="boxie-api",instance="boxie-api:9101"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 5m
    alertname: BoxieCapacityFull
    exp_alerts: []
- name: missing expected target
  interval: 15s
  input_series: []
  alert_rule_test:
  - eval_time: 1m45s
    alertname: RequiredScrapeUnavailable
    exp_alerts: []
- name: all expected missing targets
  interval: 15s
  input_series: []
  alert_rule_test:
  - eval_time: 2m
    alertname: RequiredScrapeUnavailable
    exp_alerts:
    - exp_labels:
        job: boxie-api
        severity: warning
    - exp_labels:
        job: boxie-worker
        severity: warning
    - exp_labels:
        job: boxie-agent
        severity: warning
    - exp_labels:
        job: playground
        severity: warning
    - exp_labels:
        job: boxie-api-sdk
        severity: warning
    - exp_labels:
        job: boxie-worker-sdk
        severity: warning
    - exp_labels:
        job: temporal
        severity: warning
    - exp_labels:
        job: vector
        severity: warning
    - exp_labels:
        job: victorialogs
        severity: warning
    - exp_labels:
        job: node-exporter
        severity: warning
    - exp_labels:
        job: prometheus
        severity: warning
- name: healthy idle pollers need no work counters
  interval: 15s
  input_series:
  - series: boxie_dependency_known{job="boxie-api",instance="boxie-api:9101",dependency="workflow_poller"}
    values: 1x40
  - series: boxie_dependency_known{job="boxie-api",instance="boxie-api:9101",dependency="activity_poller"}
    values: 1x40
  - series: boxie_dependency_ready{job="boxie-api",instance="boxie-api:9101",dependency="workflow_poller"}
    values: 1x40
  - series: boxie_dependency_ready{job="boxie-api",instance="boxie-api:9101",dependency="activity_poller"}
    values: 1x40
  alert_rule_test:
  - eval_time: 5m
    alertname: BoxieWorkerUnavailable
    exp_alerts: []
- name: collector threshold and hold
  interval: 15s
  input_series:
  - series: vector_buffer_size_bytes{job="vector",instance="vector:9598",component_id="storage",buffer_id="storage",buffer_type="disk",stage="0"}
    values: 80x3 81x36
  - series: vector_buffer_max_size_bytes{job="vector",instance="vector:9598",component_id="storage",buffer_id="storage",buffer_type="disk",stage="0"}
    values: 100x40
  alert_rule_test:
  - eval_time: 5m45s
    alertname: CollectorBufferHigh
    exp_alerts: []
  - eval_time: 6m
    alertname: CollectorBufferHigh
    exp_alerts:
    - exp_labels:
        job: vector
        instance: vector:9598
        component_id: storage
        buffer_id: storage
        buffer_type: disk
        stage: '0'
        severity: warning
- name: intentional newest loss alerts
  interval: 15s
  input_series:
  - series: vector_buffer_discarded_events_total{job="vector",instance="vector:9598",component_id="storage",buffer_id="storage",buffer_type="disk",stage="0",intentional="true"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 2m
    alertname: CollectorDropsIncreasing
    exp_alerts: []
  - eval_time: 2m15s
    alertname: CollectorDropsIncreasing
    exp_alerts:
    - exp_labels:
        job: vector
        instance: vector:9598
        component_id: storage
        severity: warning
- name: counter reset alone is not loss
  interval: 15s
  input_series:
  - series: boxie_log_dropped_total{job="boxie-api",instance="boxie-api:9101"}
    values: 10x3 0x36
  alert_rule_test:
  - eval_time: 5m
    alertname: ServiceLogDropsIncreasing
    exp_alerts: []
- name: disk warning threshold and hold
  interval: 15s
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: 100x40
  - series: node_filesystem_device_error{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: '0x40'
  - series: node_scrape_collector_success{job="node-exporter",instance="node-exporter:9100",collector="filesystem"}
    values: 1x40
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: 20x3 19x36
  alert_rule_test:
  - eval_time: 5m45s
    alertname: HostDiskSpaceLow
    exp_alerts: []
  - eval_time: 6m
    alertname: HostDiskSpaceLow
    exp_alerts:
    - exp_labels:
        job: node-exporter
        instance: node-exporter:9100
        device: /dev/root
        mountpoint: /
        fstype: ext4
        severity: warning
- name: disk critical threshold and hold
  interval: 15s
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: 100x40
  - series: node_filesystem_device_error{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: '0x40'
  - series: node_scrape_collector_success{job="node-exporter",instance="node-exporter:9100",collector="filesystem"}
    values: 1x40
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: 10x3 9x36
  alert_rule_test:
  - eval_time: 2m45s
    alertname: HostDiskSpaceCritical
    exp_alerts: []
  - eval_time: 3m
    alertname: HostDiskSpaceCritical
    exp_alerts:
    - exp_labels:
        job: node-exporter
        instance: node-exporter:9100
        device: /dev/root
        mountpoint: /
        fstype: ext4
        severity: critical
- name: disk error cannot manufacture capacity
  interval: 15s
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: 100x40
  - series: node_filesystem_device_error{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: 1x40
  - series: node_scrape_collector_success{job="node-exporter",instance="node-exporter:9100",collector="filesystem"}
    values: 1x40
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: '0x40'
  alert_rule_test:
  - eval_time: 5m
    alertname: HostDiskSpaceCritical
    exp_alerts: []
- name: snapshot stale hold
  interval: 15s
  input_series:
  - series: boxie_snapshot_fresh{job="boxie-api",instance="boxie-api:9101"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 1m45s
    alertname: BoxieSnapshotUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: BoxieSnapshotUnavailable
    exp_alerts:
    - exp_labels:
        job: boxie-api
        instance: boxie-api:9101
        severity: warning
- name: unknown cleanup age remains visible
  interval: 15s
  input_series:
  - series: boxie_snapshot_fresh{job="boxie-api",instance="boxie-api:9101"}
    values: 1x40
  - series: boxie_cleanup_age_unknown{job="boxie-api",instance="boxie-api:9101"}
    values: 1x40
  alert_rule_test:
  - eval_time: 1m45s
    alertname: BoxieCleanupAgeUnknown
    exp_alerts: []
  - eval_time: 2m
    alertname: BoxieCleanupAgeUnknown
    exp_alerts:
    - exp_labels:
        job: boxie-api
        instance: boxie-api:9101
        severity: warning
- name: missing activity poller hold
  interval: 15s
  input_series:
  - series: boxie_dependency_known{job="boxie-api",instance="boxie-api:9101",dependency="workflow_poller"}
    values: 1x40
  - series: boxie_dependency_known{job="boxie-api",instance="boxie-api:9101",dependency="activity_poller"}
    values: 1x40
  - series: boxie_dependency_ready{job="boxie-api",instance="boxie-api:9101",dependency="workflow_poller"}
    values: 1x40
  - series: boxie_dependency_ready{job="boxie-api",instance="boxie-api:9101",dependency="activity_poller"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 1m45s
    alertname: BoxieWorkerUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: BoxieWorkerUnavailable
    exp_alerts:
    - exp_labels:
        job: boxie-api
        instance: boxie-api:9101
        dependency: activity_poller
        severity: warning
- name: service drops increasing hold
  interval: 15s
  input_series:
  - series: boxie_log_dropped_total{job="boxie-api",instance="boxie-api:9101"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 2m
    alertname: ServiceLogDropsIncreasing
    exp_alerts: []
  - eval_time: 2m15s
    alertname: ServiceLogDropsIncreasing
    exp_alerts:
    - exp_labels:
        job: boxie-api
        instance: boxie-api:9101
        severity: warning
- name: disabled sink remains unhealthy without traffic
  interval: 15s
  input_series:
  - series: boxie_log_sink_available{job="boxie-api",instance="boxie-api:9101"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 1m45s
    alertname: ServiceLogSinkUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: ServiceLogSinkUnavailable
    exp_alerts:
    - exp_labels:
        job: boxie-api
        instance: boxie-api:9101
        severity: warning
- name: collector maximum absent is not healthy
  interval: 15s
  input_series:
  - series: up{job="vector",instance="vector:9598"}
    values: 1x40
  alert_rule_test:
  - eval_time: 1m45s
    alertname: CollectorBufferCapacityUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: CollectorBufferCapacityUnavailable
    exp_alerts:
    - exp_labels:
        job: vector
        instance: vector:9598
        severity: warning
- name: disk zero denominator omits percentage alert
  interval: 15s
  input_series:
  - series: node_filesystem_size_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: '0x40'
  - series: node_filesystem_device_error{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: '0x40'
  - series: node_scrape_collector_success{job="node-exporter",instance="node-exporter:9100",collector="filesystem"}
    values: 1x40
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="node-exporter:9100",device="/dev/root",mountpoint="/",fstype="ext4",device_error=""}
    values: '0x40'
  alert_rule_test:
  - eval_time: 5m
    alertname: HostDiskSpaceCritical
    exp_alerts: []
