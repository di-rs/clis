apiVersion: 1
datasources:
- name: Boxie Prometheus
  type: prometheus
  uid: boxie-prometheus
  orgId: 1
  url: http://prometheus:9090
  access: proxy
  isDefault: true
  editable: false
  jsonData:
    httpMethod: POST
    timeInterval: 15s
    prometheusType: Prometheus
    prometheusVersion: 3.15.0
- name: Boxie VictoriaLogs
  type: victoriametrics-logs-datasource
  uid: boxie-victorialogs
  orgId: 1
  url: http://victorialogs:9428
  access: proxy
  isDefault: false
  editable: false
  jsonData:
    httpMethod: POST
    maxLines: '1000'
