# enable-template
log:
  stdout: true
  level: warn
persistence:
  defaultStore: persistence
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    persistence:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: postgres:5432
        connectProtocol: tcp
        user: temporal
        password: {{ env "TEMPORAL_DB_PASSWORD" | quote }}
        maxConns: 20
        maxIdleConns: 5
        maxConnLifetime: 1h
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: postgres:5432
        connectProtocol: tcp
        user: visibility
        password: {{ env "VISIBILITY_DB_PASSWORD" | quote }}
        maxConns: 5
        maxIdleConns: 2
        maxConnLifetime: 1h
global:
  metrics:
    prefix: ""
    withoutUnitSuffix: true
    withoutCounterSuffix: true
    recordTimerInSeconds: true
    excludeTags:
      namespace: [boxie]
      taskqueue: [boxie-lifecycle]
    prometheus:
      framework: opentelemetry
      listenAddress: "0.0.0.0:9090"
      handlerPath: /metrics
  membership:
    maxJoinDuration: 30s
    broadcastAddress: '{{ env "TEMPORAL_BROADCAST_ADDRESS" }}'
  authorization:
    authorizer: ""
    claimMapper: ""
  tls:
    internode:
      server:
        certFile: /certs/internode.pem
        keyFile: /certs/internode.key
        requireClientAuth: true
        clientCaFiles: [/certs/internode-ca.pem]
      client:
        serverName: temporal-internode
        rootCaFiles: [/certs/internode-ca.pem]
        disableHostVerification: false
    frontend:
      server:
        certFile: /certs/frontend.pem
        keyFile: /certs/frontend.key
        requireClientAuth: true
        clientCaFiles: [/certs/internode-ca.pem, /certs/client-ca.pem]
      client:
        serverName: temporal
        rootCaFiles: [/certs/frontend-ca.pem]
        disableHostVerification: false
services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: 0.0.0.0
      httpPort: 0
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: 0.0.0.0
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: 0.0.0.0
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: 0.0.0.0
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: temporal:7233
publicClient:
  hostPort: temporal:7233
