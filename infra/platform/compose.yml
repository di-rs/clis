name: boxie-platform
services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?provide platform administrator password}
      BOXIE_DB_PASSWORD: ${BOXIE_DB_PASSWORD:?provide Boxie database password}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?provide persistence database password}
      VISIBILITY_DB_PASSWORD: ${VISIBILITY_DB_PASSWORD:?provide visibility database
        password}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    networks:
    - control
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U postgres -d postgres
        -c "SELECT 1" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: platform-postgres
volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME:?provide platform-owned persistent volume}
networks:
  control:
    name: ${BOXIE_CONTROL_NETWORK:?provide private control network name}
    external: true
  metrics:
    name: ${OBS_METRICS_NETWORK:?Set platform network handle}
    external: true
  grafana-origin:
    name: ${OBS_GRAFANA_ORIGIN_NETWORK:?Set platform network handle}
    external: true
  temporal-ui-origin:
    name: ${OBS_TEMPORAL_UI_ORIGIN_NETWORK:?Set platform network handle}
    external: true
