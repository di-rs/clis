inputs = ["inputs/fox.txt", "inputs/spiders.txt", "inputs/the-bustle.txt"]
origin = { reference = "bsd-cat", args = ["-n", "tests/inputs/fox.txt", "tests/inputs/spiders.txt", "tests/inputs/the-bustle.txt"], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0, stdout_file = "expected/all.n.out", stderr = "" }

