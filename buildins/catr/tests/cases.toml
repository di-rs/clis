schema = 1
binary = "catr"

[references.bsd-cat]
program = "/bin/cat"
platform = "macos"

[[cases]]
name = "bustle_stdin"
args = ["-"]
stdin = { mode = "pipe", files = ["inputs/the-bustle.txt"] }
origin = { reference = "bsd-cat" }
expect = { exit = 0, stdout_file = "expected/the-bustle.txt.stdin.out", stderr = "" }

[[cases]]
name = "bustle_stdin_n"
args = ["-n", "-"]
stdin = { mode = "pipe", files = ["inputs/the-bustle.txt"] }
origin = { reference = "bsd-cat" }
expect = { exit = 0, stdout_file = "expected/the-bustle.txt.n.stdin.out", stderr = "" }

[[cases]]
name = "bustle_stdin_b"
args = ["-b", "-"]
stdin = { mode = "pipe", files = ["inputs/the-bustle.txt"] }
origin = { reference = "bsd-cat" }
expect = { exit = 0, stdout_file = "expected/the-bustle.txt.b.stdin.out", stderr = "" }

