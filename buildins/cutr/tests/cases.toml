schema = 1
binary = "cutr"

[references.bsd-cut]
program = "/usr/bin/cut"
platform = "macos"
env = { LC_ALL = "en_US.UTF-8" }

[[cases]]
name = "tsv_f1"
args = ["tests/inputs/movies1.tsv", "-f", "1"]
inputs = ["inputs/movies1.tsv"]
origin = { reference = "bsd-cut", args = ["-f", "1", "tests/inputs/movies1.tsv"], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0, stdout_file = "expected/movies1.tsv.f1.out", stderr = "" }

