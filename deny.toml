# cargo-audit owns advisories; this policy checks every target and dev dependency.
[graph]
all-features = true

[licenses]
# Each accepted dependency offers one of these licenses; no private-crate bypass.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
# Duplicates are reviewed; several are legitimate transitive requirements.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
