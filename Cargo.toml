[workspace]
resolver = "3"
members = ["packages/biggie", "packages/kara", "packages/parsu", "packages/shish", "utils/*", "buildins/*", "tools/cli-testing", "tools/cli-testing/macros"]

[workspace.package]
authors = ["Dima P <dimapm@pm.me>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/di-rs/sanctuary"
readme = "README.md"
include = ["README.md", "LICENSE", "build.rs", "Cargo.toml", "src/**/*.rs"]

[workspace.dependencies]
cli-log = { path = "utils/cli-log" }
cli-testing = { path = "tools/cli-testing" }
csv = "1.4.0"
log = { version = "0.4", features = ["std", "kv"] }
anyhow = "1.0"
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
color-eyre = { version = "0.6" }

exitcode = "1.1.2"
thiserror = "2.0.20"
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
pretty_assertions = "1.4.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
