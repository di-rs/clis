[package]
name = "cli-fixtures"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Inspect CLI case catalogs and record independent reference fixtures"
readme = "README.md"

[package.metadata.cli-check]
benchmark-exemption = "Development-only fixture inspection and recording; no performance contract"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
cli-testing = { version = "0.1.0", path = "../../utils/cli-testing" }

[dev-dependencies]
assert_fs.workspace = true
cli-testing = { path = "../../utils/cli-testing" }
predicates.workspace = true

[[test]]
name = "catalog"
path = "tests/catalog.rs"
harness = false
