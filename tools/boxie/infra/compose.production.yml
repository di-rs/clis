name: ${BOXIE_PROJECT_NAME:-boxie}
services:
  api:
    image: ${BOXIE_RUNTIME_IMAGE:?Set approved immutable Boxie image}
    command:
    - boxie-api
    - --config
    - /etc/boxie/api.json
    volumes:
    - ${BOXIE_API_CONFIG:?Set API config file}:/etc/boxie/api.json:ro
    - ${BOXIE_ORCHESTRATOR_CREDENTIAL_FILE:?Set orchestrator credential file}:/run/secrets/orchestrator:ro
    - ${BOXIE_CONSUMER_CREDENTIAL_FILE:?Set consumer credential file}:/run/secrets/consumer:ro
    - ${BOXIE_POSTGRES_DSN_FILE:?Set Boxie database DSN file}:/run/secrets/postgres-dsn:ro
    - ${BOXIE_TEMPORAL_CA_FILE:?Set Temporal frontend CA}:/run/secrets/temporal-ca.pem:ro
    - ${BOXIE_API_TEMPORAL_CERT_FILE:?Set dedicated Temporal client certificate}:/run/secrets/temporal-client.pem:ro
    - ${BOXIE_API_TEMPORAL_KEY_FILE:?Set dedicated Temporal client key}:/run/secrets/temporal-client.key:ro
    networks:
      consumer:
        aliases:
        - ${BOXIE_API_ALIAS:-boxie-api}
      control: {}
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    environment:
      BOXIE_RELEASE: ${BOXIE_RELEASE:-unknown}
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: boxie-api
    pids_limit: 256
  orchestrator:
    image: ${BOXIE_RUNTIME_IMAGE:?Set approved immutable Boxie image}
    command:
    - boxie-orchestrator
    - --config
    - /etc/boxie/orchestrator.json
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${BOXIE_DATA_DIR:?Set absolute daemon host data directory}:${BOXIE_DATA_DIR}
    - ${BOXIE_ORCHESTRATOR_CONFIG:?Set orchestrator config file}:/etc/boxie/orchestrator.json:ro
    - ${BOXIE_PROFILES_FILE:?Set approved profiles file}:/etc/boxie/profiles.json:ro
    - ${BOXIE_ORCHESTRATOR_CREDENTIAL_FILE}:/run/secrets/orchestrator:ro
    - ${BOXIE_POSTGRES_DSN_FILE:?Set Boxie database DSN file}:/run/secrets/postgres-dsn:ro
    - ${BOXIE_TEMPORAL_CA_FILE:?Set Temporal frontend CA}:/run/secrets/temporal-ca.pem:ro
    - ${BOXIE_ORCHESTRATOR_TEMPORAL_CERT_FILE:?Set dedicated Temporal client certificate}:/run/secrets/temporal-client.pem:ro
    - ${BOXIE_ORCHESTRATOR_TEMPORAL_KEY_FILE:?Set dedicated Temporal client key}:/run/secrets/temporal-client.key:ro
    networks:
      control: {}
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    environment:
      BOXIE_RELEASE: ${BOXIE_RELEASE:-unknown}
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: boxie-orchestrator
    pids_limit: 256
networks:
  consumer:
    external: true
    name: ${BOXIE_CONSUMER_NETWORK:?Set private consumer network}
  control:
    external: true
    name: ${BOXIE_CONTROL_NETWORK:?Set private control network}
