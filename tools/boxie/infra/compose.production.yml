# Independently resolvable; automated production activation unavailable until PR4.
name: ${BOXIE_PROJECT_NAME:-boxie}
services:
  api:
    image: ${BOXIE_RUNTIME_IMAGE:?Set approved immutable Boxie image}
    command:
    - boxie-api
    - --config
    - /etc/boxie/api.json
    volumes:
    - ${BOXIE_API_CONFIG:?Set API config file}:/etc/boxie/api.json:ro
    - ${BOXIE_AGENT_CREDENTIAL_FILE:?Set agent credential file}:/run/secrets/agent:ro
    - ${BOXIE_CONSUMER_CREDENTIAL_FILE:?Set consumer credential file}:/run/secrets/consumer:ro
    networks:
      consumer:
        aliases:
        - ${BOXIE_API_ALIAS:-boxie-api}
      control: {}
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
  agent:
    image: ${BOXIE_RUNTIME_IMAGE:?Set approved immutable Boxie image}
    command:
    - boxie-agent
    - --config
    - /etc/boxie/agent.json
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${BOXIE_DATA_DIR:?Set absolute daemon host data directory}:${BOXIE_DATA_DIR}
    - ${BOXIE_AGENT_CONFIG:?Set agent config file}:/etc/boxie/agent.json:ro
    - ${BOXIE_PROFILES_FILE:?Set approved profiles file}:/etc/boxie/profiles.json:ro
    - ${BOXIE_AGENT_CREDENTIAL_FILE}:/run/secrets/agent:ro
    networks:
    - control
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
networks:
  consumer:
    external: true
    name: ${BOXIE_CONSUMER_NETWORK:?Set private consumer network}
  control:
    external: true
    name: ${BOXIE_CONTROL_NETWORK:?Set private control network}
