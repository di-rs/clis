name: ${BOXIE_PROJECT_NAME:-clis-boxie}
services:
  api:
    image: ${BOXIE_RUNTIME_IMAGE:?Set approved immutable Boxie image}
    command:
    - boxie-api
    - --config
    - /etc/boxie/api.json
    volumes:
    - ${BOXIE_API_CONFIG:?Set API config file}:/etc/boxie/api.json:ro
    - ${BOXIE_AGENT_CREDENTIAL_FILE:?Set agent credential file}:/run/secrets/agent:ro
    - ${BOXIE_CONSUMER_CREDENTIAL_FILE:?Set consumer credential file}:/run/secrets/consumer:ro
    - ${BOXIE_POSTGRES_DSN_FILE:?Set Boxie database DSN file}:/run/secrets/postgres-dsn:ro
    - ${BOXIE_TEMPORAL_CA_FILE:?Set Temporal frontend CA}:/run/secrets/temporal-ca.pem:ro
    - ${BOXIE_API_TEMPORAL_CERT_FILE:?Set dedicated Temporal client certificate}:/run/secrets/temporal-client.pem:ro
    - ${BOXIE_API_TEMPORAL_KEY_FILE:?Set dedicated Temporal client key}:/run/secrets/temporal-client.key:ro
    networks:
      consumer:
        aliases:
        - ${BOXIE_API_ALIAS:-boxie-api}
      control: {}
      metrics:
        aliases:
        - boxie-api
    read_only: true
    tmpfs:
    - /tmp:size=67108864,nosuid,nodev,noexec
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: boxie-api
    environment:
      BOXIE_METRICS_HOST: 0.0.0.0
      BOXIE_RELEASE: ${CLIS_RELEASE_REVISION:?Set release revision}
    user: 10001:10001
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -m
      - boxie.bootstrap.health
      - api
      - --config
      - /etc/boxie/api.json
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 30s
    stop_grace_period: 10s
    mem_limit: 512m
    pids_limit: 256
  agent:
    image: ${BOXIE_RUNTIME_IMAGE:?Set approved immutable Boxie image}
    command:
    - boxie-agent
    - --config
    - /etc/boxie/agent.json
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${BOXIE_DATA_DIR:?Set absolute daemon host data directory}:${BOXIE_DATA_DIR}
    - ${BOXIE_AGENT_CONFIG:?Set agent config file}:/etc/boxie/agent.json:ro
    - ${BOXIE_PROFILES_FILE:?Set approved profiles file}:/etc/boxie/profiles.json:ro
    - ${BOXIE_AGENT_CREDENTIAL_FILE}:/run/secrets/agent:ro
    - ${BOXIE_POSTGRES_DSN_FILE:?Set Boxie database DSN file}:/run/secrets/postgres-dsn:ro
    networks:
      control: {}
      metrics:
        aliases:
        - boxie-agent
    read_only: true
    tmpfs:
    - /tmp:size=67108864,nosuid,nodev,noexec
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: boxie-agent
    environment:
      BOXIE_METRICS_HOST: 0.0.0.0
      BOXIE_RELEASE: ${CLIS_RELEASE_REVISION:?Set release revision}
    user: 10001:10001
    group_add:
    - ${BOXIE_DOCKER_GID:?Set host Docker group}
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -m
      - boxie.bootstrap.health
      - agent
      - --config
      - /etc/boxie/agent.json
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 30s
    stop_grace_period: 45s
    mem_limit: 512m
    pids_limit: 256
  worker:
    image: ${BOXIE_RUNTIME_IMAGE:?Set approved immutable Boxie image}
    command:
    - boxie-worker
    - --config
    - /etc/boxie/worker.json
    volumes:
    - ${BOXIE_WORKER_CONFIG:?Set worker config file}:/etc/boxie/worker.json:ro
    - ${BOXIE_AGENT_CREDENTIAL_FILE}:/run/secrets/agent:ro
    - ${BOXIE_POSTGRES_DSN_FILE}:/run/secrets/postgres-dsn:ro
    - ${BOXIE_TEMPORAL_CA_FILE:?Set Temporal frontend CA}:/run/secrets/temporal-ca.pem:ro
    - ${BOXIE_WORKER_TEMPORAL_CERT_FILE:?Set dedicated Temporal client certificate}:/run/secrets/temporal-client.pem:ro
    - ${BOXIE_WORKER_TEMPORAL_KEY_FILE:?Set dedicated Temporal client key}:/run/secrets/temporal-client.key:ro
    networks:
      control: {}
      metrics:
        aliases:
        - boxie-worker
    read_only: true
    tmpfs:
    - /tmp:size=67108864,nosuid,nodev,noexec
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: boxie-worker
    environment:
      BOXIE_METRICS_HOST: 0.0.0.0
      BOXIE_RELEASE: ${CLIS_RELEASE_REVISION:?Set release revision}
    user: 10001:10001
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -m
      - boxie.bootstrap.health
      - worker
      - --config
      - /etc/boxie/worker.json
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 30s
    stop_grace_period: 25s
    mem_limit: 768m
    pids_limit: 256
networks:
  consumer:
    external: true
    name: ${BOXIE_CONSUMER_NETWORK:?Set private consumer network}
  control:
    external: true
    name: ${BOXIE_CONTROL_NETWORK:?Set private control network}
  metrics:
    external: true
    name: ${OBS_METRICS_NETWORK:?Set private metrics network}
