# Shape documentation only; deploy validated cloudflared_config output instead.
tunnel: REQUIRED_TUNNEL_UUID
credentials-file: /run/secrets/tunnel.json
ingress:
  - hostname: grafana.example.invalid
    service: http://grafana:3000
    originRequest:
      access:
        required: true
        teamName: REQUIRED_TEAM
        audTag: [REQUIRED_GRAFANA_APPLICATION_AUD]
  - hostname: temporal.example.invalid
    service: http://temporal-ui:8080
    originRequest:
      access:
        required: true
        teamName: REQUIRED_TEAM
        audTag: [REQUIRED_TEMPORAL_APPLICATION_AUD]
  - service: http_status:404
