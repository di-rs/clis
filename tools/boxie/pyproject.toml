[project]
name = "boxie"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiodocker>=0.27,<1",
    "aiohttp>=3.13,<4",
    "alembic>=1.18,<2",
    "fastapi>=0.128",
    "httpx>=0.28",
    "pydantic>=2.14,<3",
    "psycopg[binary]==3.3.6",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "sqlmodel>=0.0.37,<0.1",
    "temporalio==1.34.0",
    "uvicorn>=0.40",
    "websockets>=16",
]

[project.scripts]
boxie-orchestrator = "boxie.bootstrap.orchestrator:main"
boxie-api = "boxie.bootstrap.api:main"
boxie-worker = "boxie.bootstrap.worker:main"

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "boxie"
