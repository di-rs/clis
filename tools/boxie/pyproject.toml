[project]
name = "boxie"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiodocker>=0.27,<1",
    "fastapi>=0.128",
    "httpx>=0.28",
    "pydantic>=2.14,<3",
    "uvicorn>=0.40",
    "websockets>=16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
boxie-agent = "boxie.bootstrap.agent:main"
boxie-api = "boxie.bootstrap.api:main"
