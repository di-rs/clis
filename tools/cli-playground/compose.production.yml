# Dedicated Linux host, deployed by infra/deploy.py. Do not merge with local Compose.
name: cli-playground
services:
  gateway:
    image: ${PLAYGROUND_GATEWAY_IMAGE:?Use the approved release via infra/deploy.py}
    platform: linux/amd64
    environment:
      PLAYGROUND_DATA_DIR: /var/lib/cli-playground
      PLAYGROUND_PUBLIC_URL: https://${PLAYGROUND_DOMAIN:?Set the playground domain}
      PLAYGROUND_DEPLOY_TOKEN: ${PLAYGROUND_DEPLOY_TOKEN:?Set a random deployment token}
      PLAYGROUND_SANDBOX_IMAGE: ${PLAYGROUND_SANDBOX_IMAGE:?Use the approved release via infra/deploy.py}
      PLAYGROUND_SANDBOX_RUNTIME: runsc
      PLAYGROUND_RECONCILE_SESSIONS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/cli-playground:/var/lib/cli-playground
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import os,urllib.parse,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Host':urllib.parse.urlsplit(os.environ['PLAYGROUND_PUBLIC_URL']).netloc}); urllib.request.urlopen(r,timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
  proxy:
    image: traefik:v3.7.14
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/routes.yml
      - --certificatesresolvers.preview.acme.email=${ACME_EMAIL:?Set the certificate contact email}
      - --certificatesresolvers.preview.acme.storage=/certificates/acme.json
      - --certificatesresolvers.preview.acme.httpchallenge.entrypoint=web
    environment:
      PLAYGROUND_DOMAIN: ${PLAYGROUND_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/routes.yml:/etc/traefik/routes.yml:ro
      - /var/lib/cli-playground-proxy:/certificates
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
