[project]
name = "cli-playground"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.18,<2",
    "psycopg[binary]==3.3.6",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "sqlmodel>=0.0.37,<0.1",
    "aiohttp>=3.13,<4",
    "anyio>=4",
    "fastapi>=0.128",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.40",
    "websockets>=16",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "cli_playground"
