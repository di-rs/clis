# Backend and proxy are independently operated; activation requires acceptance gates.
name: ${CLI_PLAYGROUND_PROJECT_NAME:-cli-playground}
services:
  backend:
    image: ${CLI_PLAYGROUND_IMAGE:?Set approved immutable cli-playground image}
    environment:
      CLI_PLAYGROUND_DATA_DIR: /var/lib/cli-playground
      CLI_PLAYGROUND_PUBLIC_URL: https://${CLI_PLAYGROUND_DOMAIN:?Set cli-playground domain}
      CLI_PLAYGROUND_DEPLOY_TOKEN: ${CLI_PLAYGROUND_DEPLOY_TOKEN:?Set deployment token}
      CLI_PLAYGROUND_BOXIE_URL: ${CLI_PLAYGROUND_BOXIE_URL:?Set private Boxie endpoint}
      CLI_PLAYGROUND_BOXIE_CREDENTIAL_FILE: /run/secrets/consumer
      CLI_PLAYGROUND_PREVIEW_DOMAIN: ${CLI_PLAYGROUND_DOMAIN}
    volumes:
    - ${CLI_PLAYGROUND_DATABASE_URL_FILE:?Set Playground database URL file}:/run/secrets/CLI_PLAYGROUND_DATABASE_URL:ro
    - data:/var/lib/cli-playground
    - ${CLI_PLAYGROUND_BOXIE_CREDENTIAL_FILE:?Set consumer credential file}:/run/secrets/consumer:ro
    networks:
    - consumer
    - database
    - proxy
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: cli-playground-api
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import os,urllib.parse,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Host':urllib.parse.urlsplit(os.environ['CLI_PLAYGROUND_PUBLIC_URL']).netloc});
        urllib.request.urlopen(r,timeout=3).close()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  proxy:
    image: traefik:v3.7.14
    command:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false
    - --ping=true
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.websecure.address=:443
    - --providers.file.filename=/etc/traefik/routes.yml
    - --certificatesresolvers.preview.acme.email=${ACME_EMAIL:?Set the certificate
      contact email}
    - --certificatesresolvers.preview.acme.storage=/certificates/acme.json
    - --certificatesresolvers.preview.acme.dnschallenge.provider=cloudflare
    # Let public DNS caches catch up before the CA validates the wildcard challenge.
    - --certificatesresolvers.preview.acme.dnschallenge.propagation.delaybeforechecks=120s
    environment:
      CLI_PLAYGROUND_DOMAIN: ${CLI_PLAYGROUND_DOMAIN}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?Set the certificate DNS token}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./routes.yml:/etc/traefik/routes.yml:ro
    - certificates:/certificates
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - proxy
volumes:
  data:
    external: true
    name: ${CLI_PLAYGROUND_DATA_VOLUME:?Set product volume}
  certificates:
    external: true
    name: ${CLI_PLAYGROUND_CERTIFICATES_VOLUME:?Set certificate volume}
networks:
  consumer:
    external: true
    name: ${CLI_PLAYGROUND_CONSUMER_NETWORK:?Set private consumer network}
  proxy:
    external: true
    name: ${CLI_PLAYGROUND_PROXY_NETWORK:?Set proxy network}
  database:
    external: true
    name: ${CLI_PLAYGROUND_DATABASE_NETWORK:?Set private PostgreSQL network}
