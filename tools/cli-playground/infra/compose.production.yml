# Independently resolvable; automated production activation unavailable until PR4.
services:
  gateway:
    image: ${PLAYGROUND_IMAGE:?Set approved immutable Playground image}
    environment:
      PLAYGROUND_DATA_DIR: /var/lib/cli-playground
      PLAYGROUND_PUBLIC_URL: https://${PLAYGROUND_DOMAIN:?Set playground domain}
      PLAYGROUND_DEPLOY_TOKEN: ${PLAYGROUND_DEPLOY_TOKEN:?Set deployment token}
      PLAYGROUND_BOXIE_URL: ${PLAYGROUND_BOXIE_URL:?Set private Boxie endpoint}
      PLAYGROUND_BOXIE_CREDENTIAL_FILE: /run/secrets/consumer
      PLAYGROUND_BOXIE_PROFILE: ${PLAYGROUND_BOXIE_PROFILE:-playground}
      PLAYGROUND_PREVIEW_DOMAIN: ${PLAYGROUND_DOMAIN}
    volumes:
    - data:/var/lib/cli-playground
    - ${PLAYGROUND_BOXIE_CREDENTIAL_FILE:?Set consumer credential file}:/run/secrets/consumer:ro
    networks:
    - consumer
    - proxy
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import os,urllib.parse,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Host':urllib.parse.urlsplit(os.environ['PLAYGROUND_PUBLIC_URL']).netloc});
        urllib.request.urlopen(r,timeout=3).close()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  proxy:
    image: traefik:v3.7.14
    command:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false
    - --ping=true
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.websecure.address=:443
    - --providers.file.filename=/etc/traefik/routes.yml
    - --certificatesresolvers.preview.acme.email=${ACME_EMAIL:?Set the certificate
      contact email}
    - --certificatesresolvers.preview.acme.storage=/certificates/acme.json
    - --certificatesresolvers.preview.acme.dnschallenge.provider=cloudflare
    environment:
      PLAYGROUND_DOMAIN: ${PLAYGROUND_DOMAIN}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?Set the certificate DNS token}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./routes.yml:/etc/traefik/routes.yml:ro
    - certificates:/certificates
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - proxy
volumes:
  data:
    external: true
    name: ${PLAYGROUND_DATA_VOLUME:?Set product volume}
  certificates:
    external: true
    name: ${PLAYGROUND_CERTIFICATES_VOLUME:?Set certificate volume}
networks:
  consumer:
    external: true
    name: ${PLAYGROUND_CONSUMER_NETWORK:?Set private consumer network}
  proxy:
    external: true
    name: ${PLAYGROUND_PROXY_NETWORK:?Set proxy network}
