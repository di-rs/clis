# Traefik's file provider evaluates this Go template using its environment.
http:
  routers:
    playground:
      rule: 'Host(`{{ env "PLAYGROUND_DOMAIN" }}`)'
      entryPoints: [websecure]
      service: playground
      tls:
        certResolver: preview
  services:
    playground:
      loadBalancer:
        servers:
          - url: http://gateway:8000
        passHostHeader: true
