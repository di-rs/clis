sources:
  cli_playground_journal:
    type: journald
    current_boot_only: false
    batch_size: 16
    log_namespace: false
    journal_directory: /var/log/journal
    journalctl_path: /usr/bin/journalctl
    include_matches:
      CONTAINER_TAG:
      - cli-playground-api
transforms:
  cli_playground_normalize:
    type: remap
    inputs:
    - cli_playground_journal
    drop_on_error: true
    reroute_dropped: false
    source: "raw = string(.message) ?? \"\"\nvalid = .CONTAINER_TAG == \"cli-playground-api\" && length(raw)\
      \ <= 8192\nevent = {}\nif valid { parsed, err = parse_json(raw); if err == null && is_object(parsed)\
      \ { event = object!(parsed) } else { valid = false } }\nvalid = valid && event.service == \"cli-playground\"\
      \ && event.role == \"api\" && event.schema_version == 1\nvalid = valid && includes([\"DEBUG\", \"\
      INFO\", \"WARNING\", \"ERROR\", \"CRITICAL\"], event.level)\nmessages = {\"request.completed\":\
      \ \"Request completed\", \"sandbox.stop_pending\": \"Sandbox stop remains pending\", \"artifact.retirement_pending\"\
      : \"Artifact retirement remains pending\", \"sandbox.admission_pending\": \"Sandbox admission recovery\
      \ remains pending\", \"artifact.publication_pending\": \"Artifact publication remains pending\"\
      , \"cleanup.failed\": \"Environment cleanup failed\", \"foreign_log\": \"Dependency diagnostic\"\
      }\nexpected, err = get(messages, [string(event.event) ?? \"\"])\nvalid = valid && err == null &&\
      \ is_string(expected) && event.message == expected\n_, timestamp_error = parse_timestamp(string(event.timestamp)\
      \ ?? \"\", format: \"%+\")\nvalid = valid && timestamp_error == null && match(string(event.timestamp)\
      \ ?? \"\", r'Z$')\nvalid = valid && match(string(event.instance_id) ?? \"\", r'^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')\n\
      for_each([\"request_id\", \"sandbox_id\"]) -> |_index, key| {\n  value, err = get(event, [key])\n\
      \  if err == null && value != null { if !is_string(value) || !match(string(value) ?? \"\", r'^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')\
      \ { valid = false } }\n}\nfor_each(keys(event)) -> |_index, key| { if !includes([\"schema_version\"\
      , \"timestamp\", \"level\", \"event\", \"message\", \"service\", \"role\", \"instance_id\", \"request_id\"\
      , \"sandbox_id\"], key) { valid = false } }\nif !valid { event = {\"timestamp\": format_timestamp!(now(),\
      \ format: \"%+\"), \"event\": \"collector.rejected\", \"message\": \"event rejected\", \"service\"\
      : \"cli-playground\", \"role\": \"api\"} }\nevent.environment = get_env_var!(\"BOXIE_ENVIRONMENT\"\
      )\nevent.host = get_env_var!(\"BOXIE_HOST_ID\")\n. = event\n"
sinks:
  cli_playground_storage:
    type: http
    inputs:
    - cli_playground_normalize
    uri: http://victorialogs:9428/insert/jsonline?_stream_fields=service,role,environment,host&_msg_field=message&_time_field=timestamp
    method: post
    compression: none
    encoding:
      codec: json
    framing:
      method: newline_delimited
    acknowledgements:
      enabled: false
    buffer:
    - type: disk
      max_size: 536870912
      when_full: overflow
    - type: memory
      max_events: 1
      when_full: drop_newest
    batch:
      max_bytes: 1048576
      max_events: 64
      timeout_secs: 1
    request:
      concurrency: 1
      timeout_secs: 5
    healthcheck:
      enabled: false
tests:
- name: cli_playground valid
  inputs:
  - insert_at: cli_playground_normalize
    type: vrl
    source: |
      .CONTAINER_TAG = "cli-playground-api"
      event = {
        "schema_version": 1,
        "timestamp": "2026-10-20T12:00:00.000Z",
        "level": "INFO",
        "event": "request.completed",
        "message": "Request completed",
        "service": "cli-playground",
        "role": "api",
        "instance_id": "11111111-1111-1111-1111-111111111111",
        "request_id": "22222222-2222-2222-2222-222222222222"
      }
      raw = encode_json(event)
      # JSON whitespace reaches the size boundary without invalidating the event.
      .message = raw + " " * (8192 - length(raw))
  outputs:
  - extract_from: cli_playground_normalize
    conditions:
    - .request_id == "22222222-2222-2222-2222-222222222222" && .service == "cli-playground"
- name: cli_playground forged
  inputs:
  - insert_at: cli_playground_normalize
    type: log
    log_fields:
      CONTAINER_TAG: cli-playground-api
      message: '{"schema_version": 1, "timestamp": "2026-10-20T12:00:00.000Z", "level": "INFO", "event":
        "request.completed", "message": "Request completed", "service": "boxie", "role": "api", "instance_id":
        "11111111-1111-1111-1111-111111111111", "request_id": "22222222-2222-2222-2222-222222222222"}'
  outputs:
  - extract_from: cli_playground_normalize
    conditions:
    - .event == "collector.rejected" && !exists(.request_id)
- name: cli_playground secret
  inputs:
  - insert_at: cli_playground_normalize
    type: log
    log_fields:
      CONTAINER_TAG: cli-playground-api
      message: '{"schema_version": 1, "timestamp": "2026-10-20T12:00:00.000Z", "level": "INFO", "event":
        "request.completed", "message": "SENTINEL_secret", "service": "cli-playground", "role": "api",
        "instance_id": "11111111-1111-1111-1111-111111111111", "request_id": "22222222-2222-2222-2222-222222222222"}'
  outputs:
  - extract_from: cli_playground_normalize
    conditions:
    - .event == "collector.rejected" && .message == "event rejected"
- name: cli_playground extra
  inputs:
  - insert_at: cli_playground_normalize
    type: log
    log_fields:
      CONTAINER_TAG: cli-playground-api
      message: '{"schema_version": 1, "timestamp": "2026-10-20T12:00:00.000Z", "level": "INFO", "event":
        "request.completed", "message": "Request completed", "service": "cli-playground", "role": "api",
        "instance_id": "11111111-1111-1111-1111-111111111111", "request_id": "22222222-2222-2222-2222-222222222222",
        "token": "SENTINEL_secret"}'
  outputs:
  - extract_from: cli_playground_normalize
    conditions:
    - .event == "collector.rejected" && !exists(.token)
- name: cli_playground oversized
  inputs:
  - insert_at: cli_playground_normalize
    type: vrl
    source: |
      .CONTAINER_TAG = "cli-playground-api"
      event = {
        "schema_version": 1,
        "timestamp": "2026-10-20T12:00:00.000Z",
        "level": "INFO",
        "event": "request.completed",
        "message": "Request completed",
        "service": "cli-playground",
        "role": "api",
        "instance_id": "11111111-1111-1111-1111-111111111111",
        "request_id": "22222222-2222-2222-2222-222222222222"
      }
      raw = encode_json(event)
      # JSON whitespace reaches the size boundary without invalidating the event.
      .message = raw + " " * (8193 - length(raw))
  outputs:
  - extract_from: cli_playground_normalize
    conditions:
    - .event == "collector.rejected" && !exists(.request_id)
