name: ${PLAYGROUND_PROJECT_NAME:-cli-playground}
services:
  gateway:
    image: ${PLAYGROUND_IMAGE:-cli-playground:local}
    build:
      context: ../../..
      dockerfile: tools/cli-playground/infra/Playground.Dockerfile
    ports:
    - 127.0.0.1:8000:8000
    environment:
      PLAYGROUND_DATA_DIR: /var/lib/cli-playground
      PLAYGROUND_PUBLIC_URL: ${PLAYGROUND_PUBLIC_URL:-http://localhost:8000}
      PLAYGROUND_DEPLOY_TOKEN: ${PLAYGROUND_DEPLOY_TOKEN:?Set deployment token}
      PLAYGROUND_BOXIE_URL: ${PLAYGROUND_BOXIE_URL:?Set private Boxie endpoint}
      PLAYGROUND_BOXIE_CREDENTIAL_FILE: /run/secrets/consumer
      PLAYGROUND_BOXIE_PROFILE: ${PLAYGROUND_BOXIE_PROFILE:-playground}
      PLAYGROUND_METRICS_HOST: 0.0.0.0
    volumes:
    - data:/var/lib/cli-playground
    - ${PLAYGROUND_BOXIE_CREDENTIAL_FILE:?Set consumer credential file}:/run/secrets/consumer:ro
    networks:
      consumer: {}
      metrics:
        aliases:
        - playground
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: cli-playground-gateway
volumes:
  data:
    external: true
    name: ${PLAYGROUND_DATA_VOLUME:?Set product volume}
networks:
  consumer:
    external: true
    name: ${PLAYGROUND_CONSUMER_NETWORK:?Set private consumer network}
  metrics:
    external: true
    name: ${OBS_METRICS_NETWORK:?Set private metrics network}
