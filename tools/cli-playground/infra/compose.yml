name: ${CLI_PLAYGROUND_PROJECT_NAME:-cli-playground}
services:
  backend:
    image: ${CLI_PLAYGROUND_BACKEND_IMAGE:-cli-playground-backend:local}
    build:
      context: ../../..
      dockerfile: tools/cli-playground/infra/Backend.Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      CLI_PLAYGROUND_DATA_DIR: /var/lib/cli-playground
      CLI_PLAYGROUND_PUBLIC_URL: ${CLI_PLAYGROUND_PUBLIC_URL:-http://localhost:8000}
      CLI_PLAYGROUND_DEPLOY_TOKEN: ${CLI_PLAYGROUND_DEPLOY_TOKEN:?Set deployment token}
      CLI_PLAYGROUND_BOXIE_URL: ${CLI_PLAYGROUND_BOXIE_URL:?Set private Boxie endpoint}
      CLI_PLAYGROUND_BOXIE_CREDENTIAL_FILE: /run/secrets/consumer
      CLI_PLAYGROUND_BOXIE_PROFILE: ${CLI_PLAYGROUND_BOXIE_PROFILE:-cli-playground}
    volumes:
      - data:/var/lib/cli-playground
      - ${CLI_PLAYGROUND_BOXIE_CREDENTIAL_FILE:?Set consumer credential file}:/run/secrets/consumer:ro
    networks: [consumer]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
volumes:
  data:
    external: true
    name: ${CLI_PLAYGROUND_DATA_VOLUME:?Set product volume}
networks:
  consumer:
    external: true
    name: ${CLI_PLAYGROUND_CONSUMER_NETWORK:?Set private consumer network}
