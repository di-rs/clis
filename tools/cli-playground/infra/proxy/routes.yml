# Traefik's file provider evaluates this Go template using its environment.
http:
  routers:
    cli-playground:
      rule: 'Host(`{{ env "CLI_PLAYGROUND_DOMAIN" }}`) || HostRegexp(`^(pr-[1-9][0-9]*|[0-9a-f]{32})[.]{{ env "CLI_PLAYGROUND_DOMAIN" | replace "." "[.]" }}$`)'
      entryPoints: [websecure]
      service: cli-playground
      tls:
        certResolver: preview
        domains:
          - main: '{{ env "CLI_PLAYGROUND_DOMAIN" }}'
            sans: ['*.{{ env "CLI_PLAYGROUND_DOMAIN" }}']
  services:
    cli-playground:
      loadBalancer:
        servers:
          - url: http://backend:8000
        passHostHeader: true
