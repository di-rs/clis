[package]
name = "cli-bench"
version = "0.1.0"
description = "Correctness-checked CLI benchmark evidence"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**/*.rs", "tests/**/*.rs", "tests/inputs/**", "tests/expected/**", "examples/**/*.rs"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
cli-tracing = { path = "../../utils/cli-tracing" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
sha2 = "=0.10.9"
shell-words = "=1.1.1"
signal-hook = "=0.3.18"
rustix = { version = "=1.1.4", features = ["process", "event", "fs"] }

[dev-dependencies]
assert_cmd.workspace = true
assert_fs.workspace = true
predicates.workspace = true

[lints]
workspace = true
