[project]
name = "clis-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy", "ruff"]

[tool.uv]
package = false
required-version = ">=0.13.0"

[tool.uv.workspace]
members = ["tools/cli-bench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["tools"]
strict = true
