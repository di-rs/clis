[project]
name = "sanctuary-tools"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["cli-bench", "cli-check", "githubkit>=0.16.1,<0.17", "httpx", "anyio"]

[dependency-groups]
dev = [
    "boxie-test-support",
    "mypy",
    "pulumi==3.268.0",
    "pulumi-cloudflare==6.22.1",
    "pulumi-hcloud==1.43.1",
    "pulumi-tls==5.6.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff",
    # 0.26.0 crashes on large Rust syntax trees under Python 3.15.
    "tree-sitter==0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false
required-version = ">=0.13.0"

[tool.uv.workspace]
members = ["infra/host", "packages/boxie", "packages/boxie/tests/support", "tools/cli-playground", "packages/boxie/infra", "tools/cli-playground/infra", "tools/cli-bench", "tools/cli-check"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]
files = ["packages", "tools", "infra"]
mypy_path = ["tools", "infra/host/tests"]
strict = true
# Pulumi entry points share this filename; their implementation modules are checked.
exclude = ["infra/environments/single-host/__main__.py"]

[tool.pytest]
testpaths = ["infra/host/tests", "infra/environments/single-host/tests", "packages/boxie/tests", "tools/cli-bench/tests", "tools/cli-playground/tests", "tools/cli-check/tests"]
pythonpath = ["tools", "tools/cli-bench", "infra/host/tests", "packages/boxie/tests"]
addopts = ["--strict-config", "--strict-markers", "-p", "boxie_test_support.dependencies", "-m", "not integration"]
markers = ["integration: real isolated builds/installations and external-tool checks; prerequisites required"]

[tool.uv.sources]
cli-bench = { workspace = true }
cli-check = { workspace = true }
boxie = { workspace = true }
boxie-test-support = { workspace = true }
cli-playground = { workspace = true }
boxie-infra = { workspace = true }
host-infra = { workspace = true }
