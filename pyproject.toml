[project]
name = "clis-tools"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "boxie-test-support",
    "httpx",
    "mypy",
    "pulumi==3.268.0",
    "pulumi-cloudflare==6.22.1",
    "pulumi-hcloud==1.43.1",
    "pulumi-tls==5.6.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false
required-version = ">=0.13.0"

[tool.uv.workspace]
members = ["tools/service-logging", "tools/boxie", "tools/boxie/tests/support", "tools/cli-playground", "tools/boxie/infra", "tools/cli-playground/infra", "tools/cli-bench", "tools/cli-testing"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]
files = ["tools"]
mypy_path = ["tools"]
strict = true

[tool.pytest]
testpaths = ["tools/boxie/tests", "tools/ci/tests", "tools/cli-bench/tests", "tools/cli-playground/tests", "tools/cli-testing/tests"]
pythonpath = ["tools", "tools/cli-bench"]
addopts = ["--strict-config", "--strict-markers", "-m", "not integration"]
markers = ["integration: real isolated builds/installations and external-tool checks; prerequisites required"]

[tool.uv.sources]
service-logging = { workspace = true }
boxie = { workspace = true }
boxie-test-support = { workspace = true }
cli-playground = { workspace = true }
boxie-infra = { workspace = true }
