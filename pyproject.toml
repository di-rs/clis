[project]
name = "clis-tools"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pulumi==3.268.0",
    "pulumi-cloudflare==6.22.1",
    "pulumi-hcloud==1.43.1",
    "pulumi-tls==5.6.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false
required-version = ">=0.13.0"

[tool.uv.workspace]
members = ["tools/cli-bench", "tools/cli-playground", "tools/cli-testing"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]
files = ["tools"]
mypy_path = "tools"
strict = true

[tool.pytest]
testpaths = ["tools/ci/tests", "tools/cli-bench/tests", "tools/cli-playground/tests", "tools/cli-testing/tests"]
pythonpath = ["tools", "tools/cli-bench", "tools/cli-playground"]
addopts = ["--strict-config", "--strict-markers"]
