[package]
name = "kara"
version = "0.1.0"
edition = "2024"
description = "Text Editor Rust practice"
license = "MIT"
repository = "git@github.com:di-rs/kara.git"
keywords = ["rust", "text-editor"]
categories = ["pratice", "pet"]

[dependencies]
crossterm = "0.29.0"
color-eyre = "0.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

log.workspace = true
cli-log = { path = "../utils/cli-log" }

[dev-dependencies]
assert_fs.workspace = true
serde_json.workspace = true

[lints]
workspace = true
