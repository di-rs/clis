[package]
name = "grrs"
version = "0.1.0"
edition = "2024"
authors = ["Dima P <dimapm@pm.me>"]
license = "MIT"
description = "A tool to search files"
readme = "README.md"
homepage = "https://github.com/di-rs/clis/grrs"
repository = "https://github.com/di-rs/clis/grrs"
keywords = ["cli", "search", "demo"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
ctrlc = "3.5.2"
env_logger = "0.11.11"
exitcode = "1.1.2"
human-panic = "2.0.8"
log = "0.4.33"
thiserror = "2.0.20"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"

[build-dependencies]
clap_mangen = "0.3.0"
clap = { version = "4.6.2", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
