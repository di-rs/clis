services:
  api:
    environment:
      BOXIE_METRICS_HOST: 0.0.0.0
    networks:
      metrics:
        aliases: [boxie-api]
  supervisor:
    environment:
      BOXIE_METRICS_HOST: 0.0.0.0
    networks:
      metrics:
        aliases: [boxie-supervisor]
networks:
  metrics:
    external: true
    name: ${OBS_METRICS_NETWORK:-boxie-metrics}
