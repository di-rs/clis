# Test-only fault boundaries; every resource belongs to a random Compose project.
services:
  api:
    extends: {file: compose.yml, service: api}
    user: ${BOXIE_TEST_USER:?Set fixture owner UID:GID}
    restart: "no"
    ports: ["127.0.0.1:${BOXIE_TEST_API_PORT}:8090"]
  supervisor:
    command: [python, /fixture/supervisor_fixture.py, --config, /etc/boxie/supervisor.json]
    extends: {file: compose.yml, service: supervisor}
    user: ${BOXIE_TEST_USER:?Set fixture owner UID:GID}
    restart: "no"
    environment:
      DOCKER_HOST: unix:///faults/docker.sock
    volumes: !override
      - ${BOXIE_TEST_ROOT}/faults:/faults
      - ${BOXIE_TEST_SUPERVISOR_SCRIPT}:/fixture/supervisor_fixture.py:ro
      - ${BOXIE_DATA_DIR}:${BOXIE_DATA_DIR}:${BOXIE_TEST_DATA_MODE:-rw}
      - ${BOXIE_DATA_DIR}/profiles:${BOXIE_DATA_DIR}/profiles:rw
      - ${BOXIE_SUPERVISOR_CONFIG}:/etc/boxie/supervisor.json:ro
      - ${BOXIE_PROFILES_FILE}:/etc/boxie/profiles.json:ro
      - ${BOXIE_SUPERVISOR_CREDENTIAL_FILE}:/run/secrets/supervisor:ro
      - ${BOXIE_TEST_ROOT}/supervisor-dsn:/run/secrets/postgres-dsn:ro
      - ${BOXIE_TEMPORAL_CA_FILE}:/run/secrets/temporal-ca.pem:ro
      - ${BOXIE_SUPERVISOR_TEMPORAL_CERT_FILE}:/run/secrets/temporal-client.pem:ro
      - ${BOXIE_SUPERVISOR_TEMPORAL_KEY_FILE}:/run/secrets/temporal-client.key:ro
  faults:
    image: ${BOXIE_IMAGE}
    command: [python, /fixture/faults.py]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BOXIE_TEST_ROOT}/faults:/faults
      - ${BOXIE_TEST_FAULTS_SCRIPT}:/fixture/faults.py:ro
    networks: [control]
    restart: "no"
  cli-playground:
    image: ${CLI_PLAYGROUND_BACKEND_IMAGE}
    ports: ["127.0.0.1:${BOXIE_TEST_PRODUCT_PORT}:8000"]
    environment:
      CLI_PLAYGROUND_DATA_DIR: /data
      CLI_PLAYGROUND_PUBLIC_URL: ${CLI_PLAYGROUND_PUBLIC_URL}
      CLI_PLAYGROUND_DEPLOY_TOKEN: ${CLI_PLAYGROUND_DEPLOY_TOKEN}
      CLI_PLAYGROUND_BOXIE_URL: http://api:8090
      CLI_PLAYGROUND_BOXIE_CREDENTIAL_FILE: /run/secrets/consumer
      CLI_PLAYGROUND_BOXIE_PROFILE: cli-playground
    volumes:
      - cli-playground:/data
      - ${BOXIE_CONSUMER_CREDENTIAL_FILE}:/run/secrets/consumer:ro
    networks: [consumer]
    restart: "no"
networks:
  control:
    external: true
    name: ${BOXIE_CONTROL_NETWORK}
  consumer: {}
volumes:
  cli-playground: {}
