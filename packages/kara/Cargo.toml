[package]
name = "kara"
version = "0.1.0"
edition = "2024"
description = "Text Editor Rust practice"
license.workspace = true
repository.workspace = true
keywords = ["rust", "text-editor"]
categories = ["pratice", "pet"]

[dependencies]
crossterm = "0.29.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

log.workspace = true
cli-log.workspace = true
clap.workspace = true
anyhow.workspace = true
tempfile = "3.27.0"
rustix = { version = "1.1", features = ["fs"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }

[dev-dependencies]
cli-testing.workspace = true
predicates.workspace = true
assert_fs.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "0.13.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.6.1"

[package.metadata.cli-check]
benchmark-exemption = "Interactive terminal editor; no finite command benchmark."
