[package]
name = "kara"
version = "0.1.0"
edition = "2024"
description = "Text Editor Rust practice"
license.workspace = true
repository.workspace = true
keywords = ["rust", "text-editor"]
categories = ["pratice", "pet"]

[dependencies]
crossterm = "0.29.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

log.workspace = true
cli-log.workspace = true
anyhow.workspace = true

[dev-dependencies]
cli-testing.workspace = true
predicates.workspace = true
assert_fs.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.cli-check]
benchmark-exemption = "Interactive terminal editor; no finite command benchmark."
