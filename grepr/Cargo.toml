[package]
name = "grepr"
version = "0.1.0"
edition = "2024"
authors = ["Dima P <dimapm@pm.me>"]
license = "MIT"
description = "A tool to search files"
readme = "README.md"
homepage = "https://github.com/di-rs/clis/grep"
repository = "https://github.com/di-rs/clis/grep"
keywords = ["cli", "search", "demo"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.0", features = ["derive"] }
regex = "1.10.3"
walkdir = "2.4.0"
thiserror = "2.0.20"
clap-verbosity-flag = "3.0.4"
exitcode = "1.1.2"
ctrlc = "3.5.2"
env_logger = "0.11.11"
human-panic = "2.0.8"
log = "0.4.33"
line_prefixer = "0.1.0"

[dev-dependencies]
assert_cmd = "2.0.13"
predicates = "3.0.4"
pretty_assertions = "1.4.0"
assert_fs = "1.1.4"

[build-dependencies]
clap_mangen = "0.3.0"
clap = { version = "4.6.2", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
regex = "1.10.3"
thiserror = "2.0.20"

[lints]
workspace = true
